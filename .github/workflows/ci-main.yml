name: CI Main

# Non-blocking comprehensive monitoring for main branch pushes (Issue #116).
#
# Strategy: sequential execution to manage runner resource constraints.
# All jobs have continue-on-error: true (non-blocking, collected in step summaries).
# This workflow monitors health; ci-pr.yml enforces quality gates on PRs.
#
# Execution flow (sequential to prevent runner starvation):
#   lint → build-matrix → mbedtls-enabled → sanitizer-matrix → tsan
#
# Each phase must complete before the next begins; non-blocking for visibility.
# Excludes: subprojects/**, build/**

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Phase 1: Lint monitoring (import lint-main.yml)
  # editorconfig and uncrustify — parallel, non-blocking
  # ==========================================================================
  lint:
    uses: ./.github/workflows/lint-main.yml

  # ==========================================================================
  # Phase 2: Build & Test matrix (gated by lint, non-blocking)
  # Linux: GCC + Clang; macOS: Clang; Windows: MSVC; ARM64 GCC
  # fail-fast: false — all configurations run to completion
  # Excludes: subprojects/**, build/**
  # ==========================================================================
  build-matrix:
    name: Build / ${{ matrix.os_display || matrix.os }} / ${{ matrix.compiler }}
    needs: [lint]
    runs-on: ${{ matrix.os_runs_on || matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - GCC
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc

          # Linux - Clang
          - os: ubuntu-latest
            compiler: clang
            cc: clang

          # macOS - Clang
          - os: macos-latest
            compiler: clang
            cc: clang

          # Windows - MSVC
          - os: windows-latest
            compiler: msvc
            cc: cl

          # ARM64 - GCC (GitHub-hosted runner)
          # Uses GitHub's ubuntu-24.04-arm runner with native ARM64 support
          - os: ubuntu-24.04-arm
            os_display: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build abigail-tools
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi
          # ARM64 specific: verify NEON / aarch64 SIMD support.  The
          # historical check matched against `matrix.os == 'arm64'`,
          # which never matched the actual runner label
          # `ubuntu-24.04-arm` and silently no-op'd.  The corrected
          # comparison runs on every arm64 matrix entry (#787).
          if [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            echo "ARM64 runner detected. Verifying ASIMD / NEON support..."
            if [ -f /proc/cpuinfo ] && grep -qE 'asimd|neon' /proc/cpuinfo; then
              echo "ARM64 SIMD (asimd / NEON) support verified"
            else
              echo "Warning: ARM64 SIMD support not detected in /proc/cpuinfo"
            fi
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install meson ninja
          # pkgconfiglite ships from a SourceForge mirror without a
          # checksum; chocolatey's default policy now blocks empty
          # checksums for non-secure sources, so opt in explicitly.
          choco install pkgconfiglite -y --allow-empty-checksums

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson setup builddir -Dtests=true -DmbedTLS=disabled
        env:
          CC: ${{ matrix.cc }}

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallDir) { throw 'Visual Studio with MSVC x86/x64 tools was not found' }
          $vcvars = Join-Path $vsInstallDir 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $clExe = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe' | Select-Object -First 1
          if (-not $clExe) { throw 'cl.exe was not found under the MSVC toolset' }
          $env:PATH = "$(Split-Path -Parent $clExe);$env:PATH"
          Get-Command cl.exe
          $env:CC = 'cl'
          $env:CXX = 'cl'
          meson setup builddir -Dtests=true -DmbedTLS=disabled

      - name: Build (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallDir) { throw 'Visual Studio with MSVC x86/x64 tools was not found' }
          $vcvars = Join-Path $vsInstallDir 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $clExe = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe' | Select-Object -First 1
          if (-not $clExe) { throw 'cl.exe was not found under the MSVC toolset' }
          $env:PATH = "$(Split-Path -Parent $clExe);$env:PATH"
          Get-Command cl.exe
          $env:CC = 'cl'
          $env:CXX = 'cl'
          meson compile -C builddir

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson compile -C builddir

      - name: Test (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallDir) { throw 'Visual Studio with MSVC x86/x64 tools was not found' }
          $vcvars = Join-Path $vsInstallDir 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $clExe = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe' | Select-Object -First 1
          if (-not $clExe) { throw 'cl.exe was not found under the MSVC toolset' }
          $env:PATH = "$(Split-Path -Parent $clExe);$env:PATH"
          Get-Command cl.exe
          $env:CC = 'cl'
          $env:CXX = 'cl'
          meson test -C builddir --print-errorlogs

      - name: Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson test -C builddir --print-errorlogs

      - name: Check binary size
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        continue-on-error: true
        run: scripts/ci/check-text-size.sh builddir/libwirelog.so

      - name: Path A example compile-check
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        continue-on-error: true
        run: |
          meson install -C builddir --destdir="$PWD/staging"
          staging_prefix="$PWD/staging/usr/local"
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || true)"
          PKG_CONFIG_SYSROOT_DIR="$PWD/staging" \
          PKG_CONFIG_PATH="$staging_prefix/lib/${multiarch:+$multiarch/}pkgconfig:$staging_prefix/lib/pkgconfig" \
            meson setup builddir-path-a examples/path_a_pcap_skeleton
          meson compile -C builddir-path-a
          LD_LIBRARY_PATH="$staging_prefix/lib/${multiarch:+$multiarch:}$staging_prefix/lib" \
            ./builddir-path-a/pcap_skeleton

      - name: Publish results
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          echo "## Build Results: ${{ matrix.os }} / ${{ matrix.compiler }} (main monitor)" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${STATUS}** (non-blocking, sequential phase)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Phase 3: Optional crypto coverage (gated by build-matrix, non-blocking)
  # Mirrors the PR check name and coverage policy from #849.
  # ==========================================================================
  mbedtls-enabled:
    name: mbedtls-enabled / ubuntu-latest / gcc
    needs: [build-matrix]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libmbedtls-dev

      - name: Configure with mbedTLS enabled
        run: meson setup builddir-mbedtls -Dtests=true -DmbedTLS=enabled
        env:
          CC: gcc

      - name: Build with mbedTLS enabled
        run: meson compile -C builddir-mbedtls

      - name: Verify enabled compile flag
        run: grep -R -- '-DWL_MBEDTLS_ENABLED=1' builddir-mbedtls/compile_commands.json

      # symbol_digests covers the half of #963 that needs no mbedTLS and so
      # already runs in every other job; it is listed here as well because
      # this is the only job that exercises the emitter with the crypto
      # evaluator arms compiled in.
      - name: Test mbedTLS crypto built-ins
        run: meson test -C builddir-mbedtls cryptographic_hashes symbol_digests --print-errorlogs

      - name: Test metadata-free mbedTLS prefix discovery
        run: scripts/ci/test-mbedtls-prefix.sh

      - name: Publish results
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "## mbedTLS-enabled Results: ubuntu-latest / gcc (main monitor)" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${STATUS}** (non-blocking, sequential phase)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Phase 4: Sanitizers — ASan + UBSan (gated by mbedtls-enabled, non-blocking)
  # Linux: GCC + Clang; macOS: Apple Clang
  # fail-fast: false — all configurations run to completion
  # Excludes: subprojects/**, build/**
  # ==========================================================================
  sanitizer-matrix:
    name: Sanitizers / ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: [mbedtls-enabled]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - GCC with ASan/UBSan
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc

          # Linux - Clang with ASan/UBSan
          - os: ubuntu-latest
            compiler: clang
            cc: clang

          # macOS - Apple Clang with ASan/UBSan
          - os: macos-latest
            compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build abigail-tools
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: Configure with sanitizers
        run: >
          meson setup builddir
          -Db_sanitize=address,undefined
          -Db_lundef=false
          -Dtests=true
          --buildtype=debug
        env:
          CC: ${{ matrix.cc }}

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1

      - name: Publish results
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "## Sanitizer Results: ${{ matrix.os }} / ${{ matrix.compiler }} (main monitor)" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${STATUS}** (non-blocking, sequential phase)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Phase 5: TSan — Thread Sanitizer (gated by sanitizer-matrix, non-blocking)
  # Linux GCC + Clang only (TSan/ASan mutually exclusive)
  # Monitors mutex safety in I/O adapter registry and workqueue.
  # fail-fast: false — all configurations run to completion
  # ==========================================================================
  tsan:
    name: TSan / ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: [sanitizer-matrix]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - GCC with TSan
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc

          # Linux - Clang with TSan
          - os: ubuntu-latest
            compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build abigail-tools
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      # Force POSIX pthreads for TSan (C11 threads.h is uninstrumented)
      - name: Configure with TSan
        run: >
          meson setup builddir-tsan
          -Db_sanitize=thread
          -Db_lundef=false
          -Dthreads=posix
          -Dtests=true
          --buildtype=debug
        env:
          CC: ${{ matrix.cc }}

      - name: Build
        run: meson compile -C builddir-tsan

      - name: Test
        run: meson test -C builddir-tsan --print-errorlogs
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

      - name: Publish results
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "## TSan Results: ${{ matrix.os }} / ${{ matrix.compiler }} (main monitor)" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${STATUS}** (non-blocking, final phase)" >> "$GITHUB_STEP_SUMMARY"
