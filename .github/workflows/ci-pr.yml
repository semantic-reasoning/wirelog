name: CI PR

# PR-specific CI workflow with gated serial/parallel execution.
#
# Execution flow:
#   lint
#   ├─ build-primary (ubuntu-latest gcc, SBOM/size/path-a gates)
#   │  ├─ build-arm (ubuntu-24.04-arm gcc, ABI #681) ──┐
#   │  ├─ build-mbedtls (ubuntu-latest gcc, crypto) ──┼─ build-matrix (parallel)
#   │  ├─ tsan (independent, no gate) ────────────────┼─ sanitizer-matrix (parallel)
#   │  └─ tsan-native (independent, no gate) ─────────┘
#
# CodeQL runs in its own workflow (GitHub default-setup); not invoked from here.

on:
  pull_request:
    branches: [main, "1.0"]

permissions:
  actions: read
  contents: read

jobs:
  # ==========================================================================
  # Phase 1: Lint (import lint-pr.yml as prerequisite)
  # editorconfig -> uncrustify -> clang-tidy 22 (sequential, hard gates)
  # ==========================================================================
  lint:
    uses: ./.github/workflows/lint-pr.yml
    with:
      base-ref: ${{ github.base_ref }}

  # ==========================================================================
  # Phase 2a: Build Primary (ubuntu-latest + gcc)
  # Fast-path job that gates critical checks: SBOM, binary size, Path A example.
  # This completes first and unblocks downstream validation.
  # ==========================================================================
  build-primary:
    name: Build / ubuntu-latest / gcc
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    env:
      CC: gcc

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev uncrustify abigail-tools

      - name: Configure
        run: meson setup builddir -Dtests=true -DmbedTLS=disabled

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      # =======================================================================
      # Issue #744: SBOM snapshot CI gate
      # =======================================================================
      - name: Install syft
        run: |
          SYFT_VERSION="1.44.0"
          curl -sSfL \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin syft

      - name: SBOM snapshot gate
        run: |
          meson test -C builddir --suite sbom --print-errorlogs || {
            echo "=== SBOM gate failed. Generating debug info..."
            echo "=== Baseline snapshot:"
            head -20 sbom/snapshot.txt
            echo "..."
            echo "=== Current scan (first 20):"
            syft dir:. -o syft-json 2>/dev/null | jq -r '.artifacts[] | "\(.name)@\(.version // "unknown"):\((.licenses // [{}])[0].value // "NOASSERTION")"' | sort | head -20
            exit 1
          }

      # =======================================================================
      # Binary size regression gate (Issue #460)
      # =======================================================================
      - name: Check binary size
        run: scripts/ci/check-text-size.sh builddir/libwirelog.so

      # =======================================================================
      # Path A example compile-check (Issue #462)
      # =======================================================================
      - name: Path A example compile-check
        run: |
          meson install -C builddir --destdir="$PWD/staging"
          staging_prefix="$PWD/staging/usr/local"
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || true)"
          PKG_CONFIG_SYSROOT_DIR="$PWD/staging" \
          PKG_CONFIG_PATH="$staging_prefix/lib/${multiarch:+$multiarch/}pkgconfig:$staging_prefix/lib/pkgconfig" \
            meson setup builddir-path-a examples/path_a_pcap_skeleton
          meson compile -C builddir-path-a
          LD_LIBRARY_PATH="$staging_prefix/lib/${multiarch:+$multiarch:}$staging_prefix/lib" \
            ./builddir-path-a/pcap_skeleton

  # ==========================================================================
  # Phase: Build ARM (ubuntu-24.04-arm gcc, gated by build-primary)
  # ABI compliance check (#681); must pass before build-matrix proceeds.
  # ==========================================================================
  build-arm:
    name: Build / ubuntu-24.04-arm / gcc
    needs: [build-primary]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    env:
      CC: gcc

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev uncrustify abigail-tools

      - name: Configure
        run: meson setup builddir -Dtests=true -DmbedTLS=disabled

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

  # ==========================================================================
  # Phase: Build Matrix (gated by build-arm + build-mbedtls)
  # Linux Clang + macOS Clang + Windows MSVC
  # Only proceeds after build-primary's dependencies (ARM ABI, mbedTLS) pass.
  # ==========================================================================
  build-matrix:
    name: Build / ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: [build-arm, build-mbedtls]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - Clang
          - os: ubuntu-latest
            compiler: clang
            cc: clang

          # macOS - Clang
          - os: macos-latest
            compiler: clang
            cc: clang

          # Windows - MSVC
          - os: windows-latest
            compiler: msvc
            cc: cl

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev uncrustify abigail-tools
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja mbedtls uncrustify

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install meson ninja
          # pkgconfiglite ships from a SourceForge mirror without a
          # checksum; chocolatey's default policy now blocks empty
          # checksums for non-secure sources, so opt in explicitly.
          choco install pkgconfiglite uncrustify -y --allow-empty-checksums

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson setup builddir -Dtests=true -DmbedTLS=disabled
        env:
          CC: ${{ matrix.cc }}

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          meson setup builddir -Dtests=true -DmbedTLS=disabled

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson compile -C builddir

      - name: Build (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          meson compile -C builddir

      - name: Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson test -C builddir --print-errorlogs

      - name: Test (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          meson test -C builddir --print-errorlogs

  # ==========================================================================
  # Phase: Build mbedTLS (gated by build-primary)
  # Optional crypto coverage; must pass before build-matrix proceeds.
  # ==========================================================================
  build-mbedtls:
    name: mbedtls-enabled / ubuntu-latest / gcc
    needs: [build-primary]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev

      - name: Configure with mbedTLS enabled
        run: meson setup builddir-mbedtls -Dtests=true -DmbedTLS=enabled
        env:
          CC: gcc

      - name: Build with mbedTLS enabled
        run: meson compile -C builddir-mbedtls

      - name: Verify enabled compile flag
        run: grep -R -- '-DWL_MBEDTLS_ENABLED=1' builddir-mbedtls/compile_commands.json

      - name: Test mbedTLS crypto built-ins
        run: meson test -C builddir-mbedtls cryptographic_hashes --print-errorlogs

  # ==========================================================================
  # Phase: Sanitizer Matrix (gated by build-arm + build-mbedtls, parallel with build-matrix)
  # ASan + UBSan validation; runs in parallel with build-matrix.
  # Linux: GCC + Clang; macOS: Clang
  # ==========================================================================
  sanitizer-matrix:
    name: Sanitizers / ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: [build-arm, build-mbedtls]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - GCC
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc

          # Linux - Clang
          - os: ubuntu-latest
            compiler: clang
            cc: clang

          # macOS - Clang
          - os: macos-latest
            compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev abigail-tools
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja mbedtls

      - name: Configure with sanitizers
        run: >
          meson setup builddir-san
          -Db_sanitize=address,undefined
          -Db_lundef=false
          -Dtests=true
          --buildtype=debug
        env:
          CC: ${{ matrix.cc }}

      - name: Build with sanitizers
        run: meson compile -C builddir-san

      - name: Test with sanitizers
        run: meson test -C builddir-san --print-errorlogs
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1

  # ==========================================================================
  # Phase 3b: TSan
  # Runs after lint and in parallel with the normal build matrix.
  # TSan forces POSIX pthreads via -Dthreads=posix.
  # TSan only intercepts pthread calls; C11 <threads.h> functions
  # (thrd_create, mtx_lock) are uninstrumented and cause false SEGV.
  # ==========================================================================
  tsan:
    name: TSan / ubuntu-latest / gcc
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev

      - name: Configure with TSan
        run: |
          meson setup builddir-tsan \
            -Db_sanitize=thread \
            -Db_lundef=false \
            -Dthreads=posix \
            -Dtests=true \
            --buildtype=debug
        env:
          CC: gcc

      - name: Build with TSan
        run: meson compile -C builddir-tsan

      - name: Test with TSan
        run: meson test -C builddir-tsan --print-errorlogs
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

  # ==========================================================================
  # Phase 3b (advisory): TSan compile smoke with -Dthreads=native
  #
  # WHY THIS LEG EXISTS:
  #   The normal TSan job above forces -Dthreads=posix because libtsan's
  #   reliable synchronization interceptors are pthread-based.  This job keeps
  #   an advisory compile/link smoke for the native C11 backend under the same
  #   sanitizer flags, so wirelog/thread_c11.c remains build-covered without
  #   pretending that C11 thrd_*/mtx_*/cnd_* runtime execution is a valid race
  #   signal under GCC/libtsan.
  #
  # WHY THIS JOB DOES NOT RUN THE FULL TEST SUITE:
  #   Issue #826 showed that executing instrumented C11-created worker threads
  #   can crash the sanitizer runtime itself with ThreadSanitizer:DEADLYSIGNAL
  #   SEGV 0x18 before wirelog synchronization can be diagnosed.  Suppressions
  #   do not apply to that fatal runtime failure, and skipping only the first
  #   failing tests would leave the job noisy and misleading.  Runtime C11
  #   backend coverage comes from the ordinary non-TSan matrix; race detection
  #   remains the responsibility of the gating posix TSan leg.
  #
  # Cross-references:
  #   - docs/THREADING.md section 11 (Appendix: ThreadSanitizer configuration)
  #   - Risk C5, issue #708 (-Dthreads=native + TSan advisory leg)
  #   - Issue #826 (native C11 runtime under TSan is not a valid signal)
  # ==========================================================================
  tsan-native:
    name: TSan-native / ubuntu-latest / gcc
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev

      - name: Configure with TSan (native threads)
        run: |
          meson setup builddir-tsan-native \
            -Db_sanitize=thread \
            -Db_lundef=false \
            -Dthreads=native \
            -Dtests=true \
            --buildtype=debug
        env:
          CC: gcc

      - name: Build with TSan (native threads)
        run: meson compile -C builddir-tsan-native

      - name: Policy smoke (native threads under TSan)
        run: |
          echo "::notice title=TSan-native policy::Native C11 runtime tests are intentionally not executed under TSan; see docs/THREADING.md and issue #826."
          meson test -C builddir-tsan-native threading_doc --print-errorlogs
