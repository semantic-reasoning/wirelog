name: CI PR

# PR-specific CI workflow with gated serial/parallel execution.
#
# Execution flow:
#   rc-changelog-freeze
#   └─ lint
#      ├─ build-primary (ubuntu-latest gcc, SBOM/size/path-a gates)
#      │  ├─ build-arm (ubuntu-24.04-arm gcc, ABI #681) ──┐
#      │  └─ build-mbedtls (ubuntu-latest gcc, crypto) ──┼─ build-matrix
#      └─ sanitizer-matrix
#         ├─ tsan
#         └─ tsan-native
#
# CodeQL runs in its own workflow (GitHub default-setup); not invoked from here.

on:
  pull_request:
    branches: [main, "1.0"]

permissions:
  actions: read
  contents: read

# Compiler caching: route gcc/clang/MSVC through sccache with the GitHub
# Actions cache backend. Set workflow-wide so every build job's compile steps
# pick it up; non-build jobs simply ignore it.
env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # ==========================================================================
  # Build scope gate
  # Keep lint/policy checks active for every PR.  The active main ruleset
  # requires concrete build and sanitizer contexts, so docs-only PRs run the
  # same matrix instead of relying on skipped-job semantics.
  # ==========================================================================
  build-scope:
    name: Detect build-triggering changes
    runs-on: ubuntu-latest
    outputs:
      build-required: ${{ steps.scope.outputs.build-required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect source and build-definition changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! changed_files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"; then
            echo "Unable to determine the PR diff; running the full build as a safe fallback."
            echo "build-required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed_files"

          build_required=false
          while IFS= read -r path; do
            case "$path" in
              *.md|*.markdown|*.rst)
                continue
                ;;
              *.c|*.h|*.in|wirelog/*|tests/*|examples/*|bench/*|fuzz/*|scripts/*|subprojects/*|cross/*|abi/*|sbom/*|.github/workflows/*|meson.build|meson_options.txt|uncrustify.cfg|.clang-tidy)
                build_required=true
                ;;
            esac
          done <<< "$changed_files"

          if [ "$build_required" = true ]; then
            echo "Build-triggering source or build-definition changes detected."
          else
            echo "Documentation/metadata-only changes detected; required CI matrix still runs."
          fi
          # A skipped job can be interpreted differently by branch-protection
          # and by external status consumers. Emit every required context with
          # a real result on every PR.
          echo "build-required=true" >> "$GITHUB_OUTPUT"

  # Always run the lightweight documentation policy gate.  Job-level skips on
  # the required build matrix report Success to branch protection, while this
  # job ensures docs-only changes still execute the policy validation that is
  # otherwise registered inside the skipped Meson build.
  docs-policy:
    name: Docs / policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate support policy
        run: python3 scripts/ci/check-support-policy.py

  # ==========================================================================
  # Issue #747 B18: RC changelog freeze gate (stable always-emitting context)
  # Enforces only for PRs whose base branch is `1.0`; non-1.0 PRs SKIP/pass.
  # ==========================================================================
  rc-changelog-freeze:
    name: RC changelog freeze gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce RC changelog freeze policy
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: scripts/ci/check-changelog-rc.sh

  # ==========================================================================
  # Phase 1: Lint (import lint-pr.yml as prerequisite)
  # editorconfig -> uncrustify (sequential, hard gates)
  # ==========================================================================
  lint:
    needs: [rc-changelog-freeze]
    uses: ./.github/workflows/lint-pr.yml
    with:
      base-ref: ${{ github.base_ref }}

  # ==========================================================================
  # Phase 2a: Build Primary (ubuntu-latest + gcc)
  # Fast-path job that gates critical checks: SBOM, binary size, Path A example.
  # This completes first and unblocks downstream validation.
  # ==========================================================================
  build-primary:
    name: Build / ubuntu-latest / gcc
    needs: [lint, build-scope]
    if: ${{ needs.build-scope.outputs.build-required == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    env:
      CC: sccache gcc

    steps:
      # fetch-depth 0: the clang-tidy backlog monotonicity check below
      # compares against the MERGE BASE with the base branch, and a shallow
      # clone has none.  Matches rc-changelog-freeze and the uncrustify job.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev uncrustify abigail-tools

      - name: Configure
        run: meson setup builddir -Dtests=true -DmbedTLS=disabled

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      # =======================================================================
      # Issue #1100: clang-tidy ratchet CI gate
      #
      # Installed AFTER the Test step on purpose: the tidy suite runs in a
      # default `meson test` (there is no add_test_setup in this project), so
      # having clang-tidy on PATH earlier would run the ~15 s scan twice.
      # Without it there, the Test step reports the tidy tests as SKIPped and
      # the dedicated step below runs them once with WIRELOG_TIDY_REQUIRED=1,
      # which turns any skip into a failure.
      #
      # This is the only job that installs clang-tidy, so the ratchet's
      # guarantee is Linux/gcc-configured-build only.  The other jobs
      # (build-arm, build-matrix macOS + MSVC, build-mbedtls,
      # sanitizer-matrix, tsan) skip it at runtime rather than reporting a
      # verdict from a configuration the allowlist was not calibrated for.
      # =======================================================================
      - name: Install clang-tidy (pinned major)
        run: |
          major="$(grep -vE '^[[:space:]]*(#|$)' \
                     scripts/ci/clang-tidy-supported-majors.txt | head -1)"
          echo "Pinned clang-tidy major: $major"
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$major"
          sudo apt-get install -y "clang-tidy-$major"
          "clang-tidy-$major" --version

      - name: clang-tidy ratchet gate
        env:
          WIRELOG_TIDY_REQUIRED: "1"
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          major="$(grep -vE '^[[:space:]]*(#|$)' \
                     scripts/ci/clang-tidy-supported-majors.txt | head -1)"
          export CLANG_TIDY="clang-tidy-$major"

          # The backlog monotonicity check needs the base ref present as a
          # remote-tracking ref so it can resolve a merge base.  The
          # checkout above is full-depth, so this is normally a no-op; the
          # `|| true` keeps a transient network blip from masking the real
          # verdict with a bare `git fetch` exit code.
          #
          # If the ref still cannot be resolved, the check does NOT skip:
          # WIRELOG_TIDY_REQUIRED=1 above turns every skip into a failure,
          # deliberately, because a demotion guard that silently skips in CI
          # is not a guard.  Expect a named failure, not a silent pass.
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin \
            "$base:refs/remotes/origin/$base" || true
          export WIRELOG_TIDY_BASE_REF="origin/$base"

          meson test -C builddir --suite tidy --print-errorlogs || {
            echo "=== clang-tidy ratchet failed. Context:"
            echo "=== clang-tidy version:"
            "$CLANG_TIDY" --version
            echo "=== allowlist size: $(grep -cvE '^[[:space:]]*(#|$)' \
              scripts/ci/clang-tidy-allowlist.txt)"
            echo "=== backlog size:   $(grep -cvE '^[[:space:]]*(#|$)' \
              scripts/ci/clang-tidy-backlog.txt)"
            exit 1
          }

      # =======================================================================
      # Issue #744: SBOM snapshot CI gate
      # =======================================================================
      - name: Install syft
        run: |
          SYFT_VERSION="1.50.0"
          curl -sSfL \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin syft

      - name: SBOM snapshot gate
        run: |
          meson test -C builddir --suite sbom --print-errorlogs || {
            echo "=== SBOM gate failed. Generating debug info..."
            echo "=== Baseline snapshot:"
            head -20 sbom/snapshot.txt
            echo "..."
            echo "=== Current scan (first 20):"
            syft dir:. -o syft-json 2>/dev/null | jq -r '.artifacts[] | "\(.name)@\(.version // "unknown"):\((.licenses // [{}])[0].value // "NOASSERTION")"' | sort | head -20
            exit 1
          }

      # =======================================================================
      # Binary size regression gate (Issue #460)
      # =======================================================================
      - name: Check binary size
        run: scripts/ci/check-text-size.sh builddir/libwirelog.so

      # =======================================================================
      # Path A example compile-check (Issue #462)
      # =======================================================================
      - name: Path A example compile-check
        run: |
          meson install -C builddir --destdir="$PWD/staging"
          staging_prefix="$PWD/staging/usr/local"
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || true)"
          PKG_CONFIG_SYSROOT_DIR="$PWD/staging" \
          PKG_CONFIG_PATH="$staging_prefix/lib/${multiarch:+$multiarch/}pkgconfig:$staging_prefix/lib/pkgconfig" \
            meson setup builddir-path-a examples/path_a_pcap_skeleton
          meson compile -C builddir-path-a
          LD_LIBRARY_PATH="$staging_prefix/lib/${multiarch:+$multiarch:}$staging_prefix/lib" \
            ./builddir-path-a/pcap_skeleton

  # ==========================================================================
  # Phase: Build ARM (ubuntu-24.04-arm gcc, gated by build-primary)
  # ABI compliance check (#681); must pass before build-matrix proceeds.
  # ==========================================================================
  build-arm:
    name: Build / ubuntu-24.04-arm / gcc
    needs: [build-primary, build-scope]
    if: ${{ needs.build-scope.outputs.build-required == 'true' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
    env:
      CC: sccache gcc

    steps:
      - uses: actions/checkout@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev uncrustify abigail-tools

      - name: Configure
        run: meson setup builddir -Dtests=true -DmbedTLS=disabled

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

  # ==========================================================================
  # Phase: Build Matrix (gated by build-arm + build-mbedtls)
  # Linux Clang + macOS Clang + Windows MSVC
  # Only proceeds after build-primary's dependencies (ARM ABI, mbedTLS) pass.
  # ==========================================================================
  build-matrix:
    name: Build / ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: [build-arm, build-mbedtls, build-scope]
    if: ${{ needs.build-scope.outputs.build-required == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - Clang
          - os: ubuntu-latest
            compiler: clang
            cc: clang

          # macOS - Clang
          - os: macos-latest
            compiler: clang
            cc: clang

          # Windows - MSVC
          - os: windows-latest
            compiler: msvc
            cc: cl

    steps:
      - uses: actions/checkout@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev uncrustify abigail-tools
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja mbedtls uncrustify

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install meson ninja
          # pkgconfiglite ships from a SourceForge mirror without a
          # checksum; chocolatey's default policy now blocks empty
          # checksums for non-secure sources, so opt in explicitly.
          choco install pkgconfiglite uncrustify -y --allow-empty-checksums

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson setup builddir -Dtests=true -DmbedTLS=disabled
        env:
          CC: sccache ${{ matrix.cc }}

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallDir) { throw 'Visual Studio with MSVC x86/x64 tools was not found' }
          $vcvars = Join-Path $vsInstallDir 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $clExe = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe' | Select-Object -First 1
          if (-not $clExe) { throw 'cl.exe was not found under the MSVC toolset' }
          $env:PATH = "$(Split-Path -Parent $clExe);$env:PATH"
          Get-Command cl.exe
          $env:CC = 'sccache cl'
          $env:CXX = 'sccache cl'
          meson setup builddir -Dtests=true -DmbedTLS=disabled

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson compile -C builddir

      - name: Build (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallDir) { throw 'Visual Studio with MSVC x86/x64 tools was not found' }
          $vcvars = Join-Path $vsInstallDir 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $clExe = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe' | Select-Object -First 1
          if (-not $clExe) { throw 'cl.exe was not found under the MSVC toolset' }
          $env:PATH = "$(Split-Path -Parent $clExe);$env:PATH"
          Get-Command cl.exe
          $env:CC = 'cl'
          $env:CXX = 'cl'
          meson compile -C builddir

      - name: Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson test -C builddir --print-errorlogs

      - name: Test (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallDir) { throw 'Visual Studio with MSVC x86/x64 tools was not found' }
          $vcvars = Join-Path $vsInstallDir 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $clExe = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\cl.exe' | Select-Object -First 1
          if (-not $clExe) { throw 'cl.exe was not found under the MSVC toolset' }
          $env:PATH = "$(Split-Path -Parent $clExe);$env:PATH"
          Get-Command cl.exe
          $env:CC = 'cl'
          $env:CXX = 'cl'
          meson test -C builddir --print-errorlogs

  # ==========================================================================
  # Phase: Build mbedTLS (gated by build-primary)
  # Optional crypto coverage; must pass before build-matrix proceeds.
  # ==========================================================================
  build-mbedtls:
    name: mbedtls-enabled / ubuntu-latest / gcc
    needs: [build-primary, build-scope]
    if: ${{ needs.build-scope.outputs.build-required == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libmbedtls-dev

      - name: Configure with mbedTLS enabled
        run: meson setup builddir-mbedtls -Dtests=true -DmbedTLS=enabled
        env:
          CC: sccache gcc

      - name: Build with mbedTLS enabled
        run: meson compile -C builddir-mbedtls

      - name: Verify enabled compile flag
        run: grep -R -- '-DWL_MBEDTLS_ENABLED=1' builddir-mbedtls/compile_commands.json

      # symbol_digests covers the half of #963 that needs no mbedTLS and so
      # already runs in every other job; it is listed here as well because
      # this is the only job that exercises the emitter with the crypto
      # evaluator arms compiled in.
      - name: Test mbedTLS crypto built-ins
        run: meson test -C builddir-mbedtls cryptographic_hashes symbol_digests --print-errorlogs

      - name: Test metadata-free mbedTLS prefix discovery
        run: scripts/ci/test-mbedtls-prefix.sh

  # ==========================================================================
  # Phase: Sanitizer Matrix (starts after lint, parallel with build-primary)
  # ASan + UBSan validation; runs in parallel with build-matrix.
  # Linux: GCC + Clang + ARM64 GCC; macOS: Clang
  # ==========================================================================
  sanitizer-matrix:
    name: Sanitizers / ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: [lint, build-scope]
    if: ${{ needs.build-scope.outputs.build-required == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - GCC
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc

          # Linux - Clang
          - os: ubuntu-latest
            compiler: clang
            cc: clang

          # Linux ARM64 - GCC
          - os: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc

          # macOS - Clang
          - os: macos-latest
            compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev abigail-tools
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja mbedtls

      - name: Configure with sanitizers
        run: >
          meson setup builddir-san
          -Db_sanitize=address,undefined
          -Db_lundef=false
          -Dtests=true
          --buildtype=debugoptimized
        env:
          CC: sccache ${{ matrix.cc }}

      - name: Build with sanitizers
        run: meson compile -C builddir-san

      - name: Test with sanitizers
        run: |
          # The ARM non-sanitized build runs cspa_correctness successfully
          # (the same 20,381-tuple sentinel).  On the ARM ASan runner this
          # workload does not terminate within five minutes despite passing
          # on the other sanitizer platforms; keep the full sanitizer suite
          # while avoiding a duplicate platform-specific long-running test.
          if [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            meson test -C builddir-san --print-errorlogs \
              --exclude cspa_correctness
          else
            meson test -C builddir-san --print-errorlogs
          fi
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1

  # ==========================================================================
  # Phase 3b: TSan
  # Runs after sanitizer-matrix to keep sanitizer coverage ahead of all
  # TSan-instrumented jobs when PR runner capacity is constrained.
  # TSan forces POSIX pthreads via -Dthreads=posix.
  # TSan only intercepts pthread calls; C11 <threads.h> functions
  # (thrd_create, mtx_lock) are uninstrumented and cause false SEGV.
  # ==========================================================================
  tsan:
    name: TSan / ubuntu-latest / ${{ matrix.compiler }}
    needs: [sanitizer-matrix, build-scope]
    if: ${{ needs.build-scope.outputs.build-required == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Configure with TSan
        run: |
          meson setup builddir-tsan \
            -Db_sanitize=thread \
            -Db_lundef=false \
            -Dthreads=posix \
            -Dtests=true \
            --buildtype=debug
        env:
          CC: sccache ${{ matrix.cc }}

      - name: Build with TSan
        run: meson compile -C builddir-tsan

      - name: Test with TSan
        run: meson test -C builddir-tsan --print-errorlogs
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

  # ==========================================================================
  # Phase 3b (advisory): TSan compile smoke with -Dthreads=native
  # Runs after sanitizer-matrix for the same runner-pressure ordering as the
  # gating TSan leg while preserving its advisory compile-smoke semantics.
  #
  # WHY THIS LEG EXISTS:
  #   The normal TSan job above forces -Dthreads=posix because libtsan's
  #   reliable synchronization interceptors are pthread-based.  This job keeps
  #   an advisory compile/link smoke for the native C11 backend under the same
  #   sanitizer flags, so wirelog/thread_c11.c remains build-covered without
  #   pretending that C11 thrd_*/mtx_*/cnd_* runtime execution is a valid race
  #   signal under GCC/libtsan.
  #
  # WHY THIS JOB DOES NOT RUN THE FULL TEST SUITE:
  #   Issue #826 showed that executing instrumented C11-created worker threads
  #   can crash the sanitizer runtime itself with ThreadSanitizer:DEADLYSIGNAL
  #   SEGV 0x18 before wirelog synchronization can be diagnosed.  Suppressions
  #   do not apply to that fatal runtime failure, and skipping only the first
  #   failing tests would leave the job noisy and misleading.  Runtime C11
  #   backend coverage comes from the ordinary non-TSan matrix; race detection
  #   remains the responsibility of the gating posix TSan leg.
  #
  # Cross-references:
  #   - docs/THREADING.md section 11 (Appendix: ThreadSanitizer configuration)
  #   - Risk C5, issue #708 (-Dthreads=native + TSan advisory leg)
  #   - Issue #826 (native C11 runtime under TSan is not a valid signal)
  # ==========================================================================
  tsan-native:
    name: TSan-native / ubuntu-latest / gcc
    needs: [sanitizer-matrix, build-scope]
    if: ${{ needs.build-scope.outputs.build-required == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev

      - name: Configure with TSan (native threads)
        run: |
          meson setup builddir-tsan-native \
            -Db_sanitize=thread \
            -Db_lundef=false \
            -Dthreads=native \
            -Dtests=true \
            --buildtype=debug
        env:
          CC: sccache gcc

      - name: Build with TSan (native threads)
        run: meson compile -C builddir-tsan-native

      - name: Policy smoke (native threads under TSan)
        run: |
          echo "::notice title=TSan-native policy::Native C11 runtime tests are intentionally not executed under TSan; see docs/THREADING.md and issue #826."
          meson test -C builddir-tsan-native threading_doc --print-errorlogs
