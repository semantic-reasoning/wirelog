name: CI PR

# PR-specific CI workflow with gated serial/parallel execution.
#
# Execution flow:
#   rc-changelog-freeze
#   └─ lint
#      ├─ tsan-native (ubuntu-26.04 gcc, advisory compile smoke)
#      │  └─ sanitizer-matrix (multi-OS ASan/UBSan)
#      └─ tsan (ubuntu-26.04 gcc+clang, gating TSan)
#         └─ build-primary (ubuntu-26.04 gcc, SBOM/size/path-a gates)
#            ├─ build-arm (ubuntu-26.04-arm gcc, ABI #681) ──┐
#            └─ build-mbedtls (ubuntu-26.04 gcc, crypto) ──┼─ build-matrix
#                                                          └─ build-linux-clang-shards
#                                                             └─ build-linux-clang
#
# CodeQL runs in its own workflow (GitHub default-setup); not invoked from here.

on:
  pull_request:
    branches: [main, "1.0"]

permissions:
  actions: read
  contents: read

# Compiler caching (sccache + GHA cache) was scoped in for the sanitizer
# legs by issue #1571 (commits 8e2bf09a, 51586518) and later removed: the
# GHA-cache path was measured 3-4x slower than a plain build with a
# cache write-error storm, so these legs build with the plain compiler.

jobs:
  build-scope:
    name: Detect build-triggering changes
    runs-on: ubuntu-26.04
    outputs:
      build-required: 'true'
    steps:
      - run: echo "negative check for #2397"

  build-linux-clang-shards:
    name: Build / ubuntu-26.04 / clang / shard ${{ matrix.shard }} of 3
    needs: [build-scope]
    if: ${{ needs.build-scope.outputs.build-required == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libmbedtls-dev uncrustify abigail-tools b3sum clang

      - name: Configure
        run: meson setup builddir -Dtests=true -DmbedTLS=disabled
        env:
          CC: clang

      - name: Build
        run: meson compile -C builddir

      - name: Record bash version
        run: bash --version | head -1

      - name: Plan Linux Clang shard
        id: plan
        run: >-
          python3 scripts/ci/check-test-shards.py plan --builddir builddir
          --shard ${{ matrix.shard }} --count 3 --sha "${{ github.sha }}"
          --run-attempt "${{ github.run_attempt }}" --out shard-evidence

      - name: Test (Linux Clang shard)
        # NEGATIVE CHECK (#2397, do not merge): shard 3 times out, shard 2 fails.
        timeout-minutes: ${{ matrix.shard == 3 && 1 || 40 }}
        run: |
          meson test -C builddir --print-errorlogs --slice ${{ matrix.shard }}/3
          if [ "${{ matrix.shard }}" = 2 ]; then echo "forced shard 2 failure"; exit 1; fi

      - name: Verify shard coverage
        if: ${{ always() && steps.plan.outcome == 'success' }}
        run: >-
          python3 scripts/ci/check-test-shards.py verify --evidence shard-evidence
          --testlog builddir/meson-logs/testlog.json

      # #1487 walltime budget over the shell gates this shard ran. Each slice
      # currently holds 18-20 shell-seeded tests; with
      # WIRELOG_WALLTIME_REQUIRED=1 the gate fails loudly if one ever holds
      # none.
      - name: Shell gate walltime budget (Linux Clang shard)
        run: python3 scripts/ci/check-shell-gate-walltime.py builddir --fraction 0.5
        env:
          WIRELOG_WALLTIME_REQUIRED: "1"

      # Trimmed results only (name/result/start/duration/returncode): the raw
      # testlog carries each test's environment and output.
      - name: Upload shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-clang-shard-${{ matrix.shard }}
          path: shard-evidence
          overwrite: true
          retention-days: 7
          if-no-files-found: warn


  build-linux-clang:
    name: Build / ubuntu-26.04 / clang
    needs: [build-linux-clang-shards, build-scope]
    # !cancelled(): without a status function this job would be skipped when
    # a shard fails, and a skipped context is not a failed one.
    if: ${{ !cancelled() && needs.build-scope.outputs.build-required == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Require every shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.build-linux-clang-shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::Linux Clang shard jobs concluded '$SHARDS_RESULT'; every shard must succeed"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Download shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: linux-clang-shard-*
          path: shard-evidence

      - name: Aggregate shard coverage
        run: >-
          python3 scripts/ci/check-test-shards.py aggregate --count 3
          --sha "${{ github.sha }}" --summary "$GITHUB_STEP_SUMMARY" shard-evidence

