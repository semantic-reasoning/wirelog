name: CLA Required

on:
  pull_request_target:
    branches: [main, "1.0"]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (empty checks all open PRs)
        type: string
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  cla-signoff-gate:
    # The action publishes the stable "CLA signoff gate" check on the PR HEAD.
    # This evaluator job is deliberately named differently: comment/target
    # workflow runs are not themselves reliable PR-head checks.
    name: CLA registry evaluator
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.body == '/cla recheck')
    runs-on: ubuntu-latest
    steps:
      # Trusted code only. Never check out or execute the PR's source here.
      - uses: semantic-reasoning/sr-cla@367df706bcb50842c4103530a0656f4ce50cae70
        with:
          token: ${{ github.token }}
