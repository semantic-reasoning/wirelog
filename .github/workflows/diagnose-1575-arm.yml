name: Diagnose 1575 ARM sanitizer timeouts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/diagnose-1575-arm.yml'
      - 'scripts/ci/diagnose-arm-sanitizer-timeouts.py'
      - 'scripts/ci/test-diagnose-arm-sanitizer-timeouts.py'
      - '.github/actions/setup-meson/action.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record checkout and host
        run: |
          mkdir -p diagnostics-1575
          {
            git rev-parse HEAD
            uname -a
            cat /etc/os-release
          } > diagnostics-1575/host.log 2>&1
      - name: Install tools
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y ninja-build gdb procps libmbedtls-dev
          } 2>&1 | tee diagnostics-1575/setup.log
      - name: Set up Meson 1.12.0
        uses: ./.github/actions/setup-meson
      - name: Create diagnostic Python environment
        run: uv venv .venv-diagnose
      - name: Record tool versions
        run: |
          {
            gcc --version
            meson --version
            ninja --version
            gdb --version
            ps --version
            uv --version
            .venv-diagnose/bin/python --version
          } > diagnostics-1575/versions.log 2>&1
      - name: Selftest runner
        run: |
          set -o pipefail
          .venv-diagnose/bin/python scripts/ci/test-diagnose-arm-sanitizer-timeouts.py -v \
            2>&1 | tee diagnostics-1575/selftest.log
      - name: Configure sanitizer build
        env:
          CC: gcc
        run: |
          set -o pipefail
          meson setup builddir-san -Db_sanitize=address,undefined \
            -Db_lundef=false -Dtests=true --buildtype=debugoptimized \
            2>&1 | tee diagnostics-1575/configure.log
          meson configure builddir-san > diagnostics-1575/config.log
      - name: Compile five reproducers
        run: |
          set -o pipefail
          ninja -C builddir-san tests/test_compaction tests/test_diff_join \
            tests/test_col_rel_deep_copy tests/test_tdd_decision_stats \
            tests/test_tdd_decision_stats_nofusion \
            2>&1 | tee diagnostics-1575/build.log
      - name: Sample reproducers under parent GDB
        run: |
          mkdir -p parent-gdb-1575
          inferior_ldpath="$PWD/builddir-san/subprojects/nanoarrow:$PWD/builddir-san/subprojects/xxHash-0.8.3"
          for target in test_compaction test_diff_join test_col_rel_deep_copy \
            test_tdd_decision_stats test_tdd_decision_stats_nofusion; do
            command=(env -i PATH=/usr/bin:/bin LANG=C.UTF-8 DEBUGINFOD_URLS=
              timeout --signal=INT --kill-after=5s 10s gdb --nx --batch
              -ex 'set pagination off' -ex 'set confirm off'
              -ex 'set debuginfod enabled off'
              -ex "set environment LD_LIBRARY_PATH $inferior_ldpath"
              -ex 'set environment ASAN_OPTIONS abort_on_error=1:halt_on_error=1:print_stacktrace=1'
              -ex 'set environment UBSAN_OPTIONS abort_on_error=1:halt_on_error=1:print_stacktrace=1'
              -ex run -ex 'thread apply all bt' -ex kill
              --args "$PWD/builddir-san/tests/$target")
            printf '%q ' "${command[@]}" > "parent-gdb-1575/$target.command"
            printf '\n' >> "parent-gdb-1575/$target.command"
            rc=0
            "${command[@]}" > "parent-gdb-1575/$target.log" 2>&1 || rc=$?
            printf '%s\n' "$rc" > "parent-gdb-1575/$target.exitcode"
          done
      - name: Upload parent GDB samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parent-gdb-1575-arm-${{ github.run_id }}-${{ github.run_attempt }}
          path: parent-gdb-1575/
          if-no-files-found: warn
      - name: Run bounded diagnostics
        run: |
          set -o pipefail
          .venv-diagnose/bin/python scripts/ci/diagnose-arm-sanitizer-timeouts.py \
            --build builddir-san --output diagnostics-1575 \
            2>&1 | tee diagnostics-1575/harness.log
      - name: Upload all available evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnose-1575-arm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostics-1575/
            builddir-san/meson-logs/
          if-no-files-found: warn
