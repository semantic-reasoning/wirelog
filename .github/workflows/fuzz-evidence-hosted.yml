name: Hosted Fuzz Evidence

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Stable evidence campaign identifier (letters, digits, dot, underscore, hyphen)
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  FUZZ_SHARD_COUNT: '24'
  FUZZ_SHARD_SECONDS: '3600'

jobs:
  validate:
    name: Validate hosted campaign
    runs-on: ubuntu-latest
    outputs:
      campaign_id: ${{ steps.plan.outputs.campaign_id }}
    steps:
      - id: plan
        shell: bash
        env:
          REQUESTED_CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          set -euo pipefail
          campaign_id="$REQUESTED_CAMPAIGN_ID"
          if [[ -z "$campaign_id" ]]; then
            campaign_id="fuzz-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          fi
          [[ "$campaign_id" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || {
            echo "campaign_id contains unsupported characters or is too long" >&2
            exit 1
          }
          echo "campaign_id=$campaign_id" >> "$GITHUB_OUTPUT"

  shard-01:
    name: Fuzz shard 1/24
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout immutable commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install fuzz dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build
      - name: Set up Meson 1.12.0
        uses: ./.github/actions/setup-meson
      - name: Configure fuzz build
        shell: bash
        run: |
          CC=clang meson setup build-fuzz -Denable_fuzz=true -Db_sanitize=address -Db_lundef=false -Dtests=true
      - name: Compile fuzz targets
        shell: bash
        run: |
          meson compile -C build-fuzz parser_fuzz csv_reader_fuzz intern_fuzz compound_arena_fuzz
      - name: Seed initial corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shard-input
          for target in parser csv_reader intern compound_arena; do
            mkdir -p "shard-input/$target"
            cp -a "tests/fuzz/corpus/$target/." "shard-input/$target/corpus"
          done
      - name: Run corpus-continuous shard
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 scripts/fuzz/run-campaign-shard.py \
            --build-dir build-fuzz \
            --input-root shard-input \
            --output-root shard-output \
            --campaign-id "${{ needs.validate.outputs.campaign_id }}" \
            --shard-index 1 \
            --shard-count "${{ env.FUZZ_SHARD_COUNT }}" \
            --duration-seconds "${{ env.FUZZ_SHARD_SECONDS }}" \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"
      - name: Package shard evidence
        if: ${{ always() }}
        shell: bash
        run: tar -czf shard-output.tar.gz shard-output
      - name: Upload immutable shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-campaign-${{ needs.validate.outputs.campaign_id }}-run-${{ github.run_id }}-shard-01-attempt-${{ github.run_attempt }}
          path: shard-output.tar.gz
          if-no-files-found: error
          retention-days: 90

