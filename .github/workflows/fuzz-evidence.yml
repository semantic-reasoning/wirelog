name: Fuzz Evidence

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Per-shard libFuzzer duration (six shards per target)
        required: true
        default: 4h
        type: string
      timeout_minutes:
        description: Maximum time for each hosted shard job
        required: true
        default: "360"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate hosted campaign
    runs-on: ubuntu-latest
    steps:
      - name: Validate six-shard hosted configuration
        env:
          DURATION: ${{ inputs.duration }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DURATION" =~ ^[0-9]+([smh])?$ ]]; then exit 1; fi
          value="${DURATION%[smh]}"
          suffix="${DURATION:${#value}}"
          case "$suffix" in
            h) seconds=$((value * 3600)) ;;
            m) seconds=$((value * 60)) ;;
            s|"") seconds=$value ;;
          esac
          (( seconds > 0 && seconds <= 14400 )) || exit 1
          [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] || exit 1
          (( TIMEOUT_MINUTES <= 360 )) || exit 1
          required=$(((seconds + 59) / 60 + 60))
          (( TIMEOUT_MINUTES >= required )) || exit 1

  shard_1:
    name: Fuzz shard 1 / ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix: {target: [parser, csv_reader, intern, compound_arena]}
    uses: ./.github/workflows/fuzz-evidence-shard.yml
    with:
      target: ${{ matrix.target }}
      duration: ${{ inputs.duration }}
      shard_index: 1
      shard_count: 6
      previous_shard: 0
      timeout_minutes: ${{ inputs.timeout_minutes }}

  shard_2:
    name: Fuzz shard 2 / ${{ matrix.target }}
    needs: shard_1
    strategy:
      fail-fast: false
      matrix: {target: [parser, csv_reader, intern, compound_arena]}
    uses: ./.github/workflows/fuzz-evidence-shard.yml
    with:
      target: ${{ matrix.target }}
      duration: ${{ inputs.duration }}
      shard_index: 2
      shard_count: 6
      previous_shard: 1
      timeout_minutes: ${{ inputs.timeout_minutes }}

  shard_3:
    name: Fuzz shard 3 / ${{ matrix.target }}
    needs: shard_2
    strategy:
      fail-fast: false
      matrix: {target: [parser, csv_reader, intern, compound_arena]}
    uses: ./.github/workflows/fuzz-evidence-shard.yml
    with:
      target: ${{ matrix.target }}
      duration: ${{ inputs.duration }}
      shard_index: 3
      shard_count: 6
      previous_shard: 2
      timeout_minutes: ${{ inputs.timeout_minutes }}

  shard_4:
    name: Fuzz shard 4 / ${{ matrix.target }}
    needs: shard_3
    strategy:
      fail-fast: false
      matrix: {target: [parser, csv_reader, intern, compound_arena]}
    uses: ./.github/workflows/fuzz-evidence-shard.yml
    with:
      target: ${{ matrix.target }}
      duration: ${{ inputs.duration }}
      shard_index: 4
      shard_count: 6
      previous_shard: 3
      timeout_minutes: ${{ inputs.timeout_minutes }}

  shard_5:
    name: Fuzz shard 5 / ${{ matrix.target }}
    needs: shard_4
    strategy:
      fail-fast: false
      matrix: {target: [parser, csv_reader, intern, compound_arena]}
    uses: ./.github/workflows/fuzz-evidence-shard.yml
    with:
      target: ${{ matrix.target }}
      duration: ${{ inputs.duration }}
      shard_index: 5
      shard_count: 6
      previous_shard: 4
      timeout_minutes: ${{ inputs.timeout_minutes }}

  shard_6:
    name: Fuzz shard 6 / ${{ matrix.target }}
    needs: shard_5
    strategy:
      fail-fast: false
      matrix: {target: [parser, csv_reader, intern, compound_arena]}
    uses: ./.github/workflows/fuzz-evidence-shard.yml
    with:
      target: ${{ matrix.target }}
      duration: ${{ inputs.duration }}
      shard_index: 6
      shard_count: 6
      previous_shard: 5
      timeout_minutes: ${{ inputs.timeout_minutes }}

  verify:
    name: Verify hosted campaign evidence
    if: ${{ always() }}
    needs: [shard_1, shard_2, shard_3, shard_4, shard_5, shard_6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download shard evidence
        uses: actions/download-artifact@v7
        with:
          pattern: fuzz-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: fuzz-evidence/corpora
          merge-multiple: true
      - name: Download shard records
        uses: actions/download-artifact@v7
        with:
          pattern: fuzz-record-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: fuzz-evidence/records
          merge-multiple: true
      - name: Verify all targets and corpus handoffs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t records < <(find fuzz-evidence/records -type f -name '*.json' -print | sort)
          ((${#records[@]} == 24)) || exit 1
          python3 scripts/fuzz/verify-hosted-campaign.py --evidence-root fuzz-evidence "${records[@]}" | tee fuzz-evidence/verification.json
      - name: Upload verified campaign evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-campaign-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz-evidence
          if-no-files-found: warn
          retention-days: 30
