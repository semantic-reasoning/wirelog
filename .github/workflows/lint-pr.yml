name: Lint PR

# PR-specific lint workflow with hard-gate semantics.
# Runs 2 sequential checks: editorconfig -> uncrustify
# Each check must pass before the next runs (fail-fast).
# This workflow is imported by ci-pr.yml as Phase 1.

on:
  workflow_call:
    inputs:
      base-ref:
        description: PR base branch to diff against for changed-file checks
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Phase 1a: EditorConfig check (fast, ~seconds)
  # Hard gate: enforces whitespace, encoding, and line-ending consistency.
  # ==========================================================================
  editorconfig-check:
    name: EditorConfig check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install editorconfig-checker
        env:
          EC_VERSION: "3.0.3"
        run: |
          wget -q "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/ec-linux-amd64.tar.gz" -O ec.tar.gz
          tar xzf ec.tar.gz
          sudo mv bin/ec-linux-amd64 /usr/local/bin/ec
          ec --version

      - name: Run editorconfig-checker
        run: |
          set -o pipefail
          ec --disable-indent-size \
            --exclude '(subprojects/.*|build.*)' \
            wirelog/ tests/ *.md meson.build meson_options.txt 2>&1 | tee ec-results.txt

      - name: Publish results
        if: always()
        run: |
          echo '## EditorConfig Results' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -s ec-results.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat ec-results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No issues found.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ==========================================================================
  # Phase 1b: uncrustify check (fast-medium, ~1-2 min)
  # Hard gate: formatting violations fail the PR.
  # Excludes: subprojects/**, build/**
  # ==========================================================================
  uncrustify-check:
    name: uncrustify check
    needs: [editorconfig-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uncrustify
        run: |
          sudo apt-get update
          sudo apt-get install -y uncrustify

      - name: Verify tool version
        run: uncrustify --version

      - name: Run uncrustify (hard gate)
        run: |
          set -o pipefail
          BASE_REF="${{ inputs.base-ref }}"
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          # Get list of changed .c and .h files in this PR
          CHANGED_FILES=$(git diff "origin/${BASE_REF}...HEAD" --name-only --diff-filter=ACM | grep -E '\.(c|h)$' | grep -E '^(wirelog|tests)/' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No C/H files changed in this PR."
            exit 0
          fi

          echo "Checking formatting for changed files:"
          echo "$CHANGED_FILES"
          echo ""

          echo "$CHANGED_FILES" | while read file; do \
            uncrustify -c uncrustify.cfg --check "$file" 2>&1; \
          done | tee format-results.txt

          if grep -q "FAIL" format-results.txt; then
            echo "uncrustify found formatting issues. PR blocked."
            exit 1
          fi

      - name: Publish results
        if: always()
        run: |
          echo '## uncrustify Results' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -s format-results.txt ]; then
            count=$(wc -l < format-results.txt | tr -d ' ')
            echo "**${count} finding(s) — PR blocked**" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -100 format-results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No formatting issues found.' >> "$GITHUB_STEP_SUMMARY"
          fi
