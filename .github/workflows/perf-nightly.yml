name: Perf Nightly

# Nightly WL_LOG disabled-path perf gate (issue #508 Phase 3).
#
# Why separate from ci-main.yml / ci-pr.yml:
#   The perf gate is intentionally opt-in (WIRELOG_PERF_GATE=1) because
#   shared CI runners exhibit several-percent wall-clock noise above the
#   1% wall budget. Running it per-PR would be flaky; running it never
#   means regressions can slip to main. Nightly is the compromise.
#
# Runners:
#   ubuntu-latest   - GCC; sets cpufreq governor to performance via
#                     cpupower if available, pins to CPU 0 via taskset.
#   windows-latest  - MSVC; bench_stability_prep() in the test handles
#                     thread affinity + HIGH_PRIORITY_CLASS internally.
#
# Both runners are shared GitHub-hosted boxes. The coefficient-of-
# variation self-check inside test_log_perf_gate converts noisy runs
# to SKIP (exit 77) instead of FAIL, so background load never produces
# a false regression signal. When the gate actually FAILs, it means
# both wall-delta > 1% AND per-iter > 1 ns tripped on a measurement
# stable enough to pass the CoV ceiling - a real regression.
#
# fail-fast: false  - both matrix entries run to completion even if
# one fails, so we get a complete picture per night.

on:
  schedule:
    # Daily at 04:00 UTC (overnight US Pacific / EU early morning).
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      portfolio_tier:
        description: 'bench_flowlog portfolio tier'
        type: choice
        options:
          - smoke
          - light
          - readme-full
        default: light
      portfolio_workers:
        description: 'Comma-separated portfolio worker counts'
        default: '1'
      portfolio_repeat:
        description: 'Portfolio repeat count'
        default: '1'

permissions:
  contents: read
  actions: read

jobs:
  perf:
    name: Perf / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
          - os: windows-latest
            compiler: msvc
            cc: cl

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build linux-tools-common linux-tools-generic

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install meson ninja
          choco install pkgconfiglite -y

      # Best-effort: request the 'performance' cpufreq governor. On
      # GitHub's ubuntu-latest the governor is usually already
      # 'performance' or 'schedutil'; if it is not and cpupower cannot
      # set it (no permission / no governor driver), the test will SKIP
      # with a diagnostic rather than FAIL.
      - name: Set cpufreq governor (Linux, best-effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo cpupower frequency-set -g performance || true
          for cpu in /sys/devices/system/cpu/cpu[0-9]*/cpufreq/scaling_governor; do
            echo "governor($cpu) = $(cat "$cpu" 2>/dev/null || echo 'unreadable')"
          done

      - name: Configure release + trace ceiling (Linux)
        if: runner.os == 'Linux'
        run: >
          meson setup build-perf
          --buildtype=release
          -Dwirelog_log_max_level=trace
          -Dtests=true
          -DmbedTLS=disabled
        env:
          CC: ${{ matrix.cc }}

      - name: Configure release + trace ceiling (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          meson setup build-perf --buildtype=release -Dwirelog_log_max_level=trace -Dtests=true -DmbedTLS=disabled

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: meson compile -C build-perf

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          meson compile -C build-perf

      # Linux: taskset pins the meson test harness to CPU 0. The test
      # still benefits from the operator-imposed cpufreq=performance
      # check pre-gate; if that check fails, the test SKIPs cleanly.
      - name: Run perf suite (Linux)
        if: runner.os == 'Linux'
        env:
          WIRELOG_PERF_GATE: '1'
        run: |
          taskset -c 0 meson test -C build-perf --suite perf --print-errorlogs --num-processes 1

      # Windows: bench_stability_prep() sets thread affinity and raises
      # priority class from inside the test process. No external wrapper
      # needed; meson test invokes the binary directly.
      - name: Run perf suite (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          WIRELOG_PERF_GATE: '1'
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          meson test -C build-perf --suite perf --print-errorlogs --num-processes 1

      - name: Collect flowlog portfolio (Linux)
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        env:
          PORTFOLIO_TIER: ${{ github.event.inputs.portfolio_tier || 'light' }}
          PORTFOLIO_WORKERS: ${{ github.event.inputs.portfolio_workers || '1' }}
          PORTFOLIO_REPEAT: ${{ github.event.inputs.portfolio_repeat || '1' }}
        run: |
          set +e
          python scripts/perf/run-flowlog-portfolio.py \
            --bench build-perf/bench/bench_flowlog \
            --tier "$PORTFOLIO_TIER" \
            --workers "$PORTFOLIO_WORKERS" \
            --repeat "$PORTFOLIO_REPEAT" \
            --out-dir perf-artifacts/portfolio
          rc=$?
          echo "portfolio_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "PORTFOLIO_EXIT=$rc" >> "$GITHUB_ENV"
          echo "portfolio_exit=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Collect flowlog portfolio (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: bash
        env:
          PORTFOLIO_TIER: ${{ github.event.inputs.portfolio_tier || 'light' }}
          PORTFOLIO_WORKERS: ${{ github.event.inputs.portfolio_workers || '1' }}
          PORTFOLIO_REPEAT: ${{ github.event.inputs.portfolio_repeat || '1' }}
        run: |
          set +e
          python scripts/perf/run-flowlog-portfolio.py \
            --bench build-perf/bench/bench_flowlog.exe \
            --tier "$PORTFOLIO_TIER" \
            --workers "$PORTFOLIO_WORKERS" \
            --repeat "$PORTFOLIO_REPEAT" \
            --out-dir perf-artifacts/portfolio
          rc=$?
          echo "portfolio_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "PORTFOLIO_EXIT=$rc" >> "$GITHUB_ENV"
          echo "portfolio_exit=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload flowlog portfolio artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-portfolio-${{ matrix.os }}-${{ matrix.compiler }}
          path: perf-artifacts/portfolio
          if-no-files-found: warn
          retention-days: 35

      - name: Summarize flowlog portfolio
        if: always()
        shell: bash
        run: |
          python scripts/perf/summarize-flowlog-portfolio.py \
            --artifact-dir perf-artifacts/portfolio \
            --artifact-name "perf-portfolio-${{ matrix.os }}-${{ matrix.compiler }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          echo "## Perf Nightly: ${{ matrix.os }} / ${{ matrix.compiler }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${STATUS}**" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build-perf/meson-logs/testlog.txt ]; then
            echo '<details><summary>Perf suite testlog</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -A 30 'test_log_perf_gate' build-perf/meson-logs/testlog.txt 2>/dev/null \
              | head -200 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          fi

  portfolio-skip-rate:
    name: Perf portfolio SKIP-rate history
    needs: perf
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Download recent portfolio artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p perf-artifacts/history perf-artifacts/skip-rate
          warnings=perf-artifacts/skip-rate/warnings.log
          : > "$warnings"
          cutoff="$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          if ! gh run list \
              --workflow perf-nightly.yml \
              --created ">=$cutoff" \
              --limit 100 \
              --json databaseId \
              --jq '.[].databaseId' > perf-artifacts/skip-rate/runs.txt; then
            echo "gh run list failed; no history downloaded" >> "$warnings"
          fi
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            dest="perf-artifacts/history/run-$run_id"
            mkdir -p "$dest"
            if ! gh run download "$run_id" \
                --pattern 'perf-portfolio-*' \
                --dir "$dest"; then
              echo "failed to download perf portfolio artifacts for run $run_id" >> "$warnings"
            fi
          done < perf-artifacts/skip-rate/runs.txt

      - name: Summarize portfolio SKIP-rate history
        if: always()
        shell: bash
        run: |
          mkdir -p perf-artifacts/skip-rate
          python scripts/perf/summarize-flowlog-portfolio-history.py \
            --root perf-artifacts/history \
            --window-days 30 \
            --json-out perf-artifacts/skip-rate/skip-rate.json \
            > perf-artifacts/skip-rate/skip-rate.md
          if [ -s perf-artifacts/skip-rate/warnings.log ]; then
            {
              echo ''
              echo '<details><summary>Artifact download warnings</summary>'
              echo ''
              sed 's/^/- /' perf-artifacts/skip-rate/warnings.log
              echo ''
              echo '</details>'
            } >> perf-artifacts/skip-rate/skip-rate.md
          fi
          cat perf-artifacts/skip-rate/skip-rate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload portfolio SKIP-rate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-portfolio-skip-rate
          path: perf-artifacts/skip-rate
          if-no-files-found: warn
          retention-days: 35

  # ==========================================================================
  # Stress nightly (Issue #594): runs the W=4 / R=500 freeze-cycle and
  # W=4 / R=5000 apply-roundtrip workloads under TSan instrumentation on
  # Linux GCC.  Independent of the perf gate above (different build flags
  # and different test suite) so a stress regression doesn't mask a perf
  # regression and vice-versa.  See docs/STRESS_BASELINE.md for the
  # release-tier (W=8) invocation and the flake-baseline protocol.
  # ==========================================================================
  stress:
    name: Stress / ubuntu-latest / gcc / TSan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Configure debug + TSan
        run: >
          meson setup build-stress-tsan
          -Db_sanitize=thread
          -Db_lundef=false
          -Dthreads=posix
          -Dtests=true
          --buildtype=debug
        env:
          CC: gcc

      - name: Build
        run: meson compile -C build-stress-tsan

      - name: Run stress-nightly suite under TSan
        env:
          TSAN_OPTIONS: 'halt_on_error=1:second_deadlock_stack=1'
        run: |
          meson test -C build-stress-tsan --suite stress-nightly \
            --print-errorlogs --num-processes 1

      - name: Publish results
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          echo "## Stress Nightly: ubuntu-latest / gcc / TSan" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${STATUS}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build-stress-tsan/meson-logs/testlog.txt ]; then
            echo '<details><summary>Stress-nightly testlog</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -A 30 'stress_harness' build-stress-tsan/meson-logs/testlog.txt 2>/dev/null \
              | head -200 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          fi
