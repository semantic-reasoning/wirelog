name: Perf Nightly

# Nightly WL_LOG disabled-path perf gate (issue #508 Phase 3).
#
# Why separate from ci-main.yml / ci-pr.yml:
#   The perf gate is intentionally opt-in (WIRELOG_PERF_GATE=1) because
#   shared CI runners exhibit several-percent wall-clock noise above the
#   1% wall budget. Running it per-PR would be flaky; running it never
#   means regressions can slip to main. Nightly is the compromise.
#
# Runners:
#   perf            - self-hosted Linux x64 runner. Build and test tools run
#                     in its local semantic-reasoning:ubuntu26 image; W=1
#                     CRDT/CSPA measurements require CPU 0 and valid telemetry.
#   windows-latest  - MSVC; bench_stability_prep() in the test handles
#                     thread affinity + HIGH_PRIORITY_CLASS internally.
#
# The Windows runner is shared GitHub-hosted. The coefficient-of-
# variation self-check inside test_log_perf_gate converts noisy runs
# to SKIP (exit 77) instead of FAIL, so background load never produces
# a false regression signal. When the gate actually FAILs, it means
# both wall-delta > 1% AND per-iter > 1 ns tripped on a measurement
# stable enough to pass the CoV ceiling - a real regression.
#
# fail-fast: false  - both matrix entries run to completion even if
# one fails, so we get a complete picture per night.

on:
  schedule:
    # Daily at 04:00 UTC (overnight US Pacific / EU early morning).
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      portfolio_tier:
        description: 'bench_flowlog portfolio tier'
        type: choice
        options:
          - smoke
          - light
          - readme-full
        default: readme-full
      portfolio_workers:
        description: 'Comma-separated portfolio worker counts'
        default: '1'
      portfolio_repeat:
        description: 'Portfolio repeat count'
        default: '1'
      strict_smoke:
        description: 'Run only strict CRDT/CSPA acquisition on the Linux perf host'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  perf:
    name: Perf / ${{ matrix.os }} / ${{ matrix.compiler }}
    if: github.repository == 'semantic-reasoning/wirelog' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(matrix.runner) }}
    continue-on-error: ${{ matrix.os == 'windows' }}
    concurrency:
      group: wirelog-perf-${{ matrix.os }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: '["self-hosted", "Linux", "X64", "perf"]'
            compiler: gcc
            cc: gcc
          - os: windows
            runner: '["self-hosted", "Windows", "X64", "windows-latest", "wirelog-perf"]'
            compiler: msvc
            cc: cl

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows' && !inputs.strict_smoke
        run: |
          choco install pkgconfiglite -y

      - name: Set up Meson 1.12.0
        uses: ./.github/actions/setup-meson
        if: runner.os == 'Windows' && !inputs.strict_smoke

      # Request the performance governor as a best-effort noise reduction.
      # The Linux nightly suite records the observed value as provenance.
      - name: Set cpufreq governor (Linux, best-effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo cpupower frequency-set -g performance || true
          for cpu in /sys/devices/system/cpu/cpu[0-9]*/cpufreq/scaling_governor; do
            echo "governor($cpu) = $(cat "$cpu" 2>/dev/null || echo 'unreadable')"
          done

      - name: Configure release + trace ceiling (Windows)
        if: runner.os == 'Windows' && !inputs.strict_smoke
        shell: cmd
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc }}
        # Force MSVC even when the image also exposes MinGW. Meson discovers
        # Visual Studio and restores its environment in compile/test steps.
        run: |
          meson setup build-perf --vsenv --buildtype=release -Dwirelog_log_max_level=trace -Dtests=true -DmbedTLS=disabled

      - name: Build (Windows)
        if: runner.os == 'Windows' && !inputs.strict_smoke
        shell: cmd
        run: |
          meson compile -C build-perf

      - name: Capture Linux perf host before suite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p perf-artifacts/linux-suite
          {
            echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
            echo 'requested_affinity=0'
            taskset -pc $$
            echo "kernel=$(uname -srmo)"
            echo "cpu_model=$(awk -F: '/^model name[[:space:]]*:/ { sub(/^[[:space:]]+/, "", $2); print $2; exit }' /proc/cpuinfo)"
            echo "boot_id=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo unavailable)"
            echo "loadavg=$(cat /proc/loadavg 2>/dev/null || echo unavailable)"
            for file in /sys/fs/cgroup/cpuset.cpus.effective /sys/fs/cgroup/cpu.stat /proc/pressure/cpu; do
              echo "[$file]"
              cat "$file" 2>/dev/null || echo unavailable
            done
            for name in scaling_governor scaling_cur_freq scaling_min_freq scaling_max_freq cpuinfo_cur_freq; do
              file="/sys/devices/system/cpu/cpu0/cpufreq/$name"
              if [ -r "$file" ]; then
                echo "$name=$(cat "$file")"
              else
                echo "$name=unavailable"
              fi
            done
          } > perf-artifacts/linux-suite/host-before.txt

      # The image-owned Linux runner applies CPU 0 only to strict W=1 CRDT and
      # CSPA gates. Its broader legacy suite and portfolio retain full affinity.
      - name: Run perf suite (Linux)
        if: runner.os == 'Linux'
        env:
          PORTFOLIO_TIER: ${{ github.event.inputs.portfolio_tier || 'readme-full' }}
          PORTFOLIO_WORKERS: ${{ github.event.inputs.portfolio_workers || '1' }}
          PORTFOLIO_REPEAT: ${{ github.event.inputs.portfolio_repeat || '1' }}
          PERF_ARTIFACT_DIR: ${{ github.workspace }}/perf-artifacts/linux-suite
          PERF_STRICT_SMOKE: ${{ inputs.strict_smoke }}
        run: |
          scripts/ci/run-perf-nightly-linux.sh

      - name: Capture Linux perf suite evidence
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p perf-artifacts/linux-suite
          {
            echo "commit=$COMMIT_SHA"
            echo "checkout_commit=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "run=$RUN_ID attempt=$RUN_ATTEMPT"
            echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
            echo 'runner_labels=self-hosted,Linux,X64,perf'
            echo 'mode=nightly strict_CRDT_CSPA=true governor_eligibility=required'
            echo 'WIRELOG_PERF_GATE=1 WIRELOG_PERF_REQUIRE=1'
            echo 'requested_affinity=0'
            taskset -pc $$
            echo "kernel=$(uname -srmo)"
            echo "cpu_model=$(awk -F: '/^model name[[:space:]]*:/ { sub(/^[[:space:]]+/, "", $2); print $2; exit }' /proc/cpuinfo)"
            echo "boot_id=$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || echo unavailable)"
            echo "loadavg=$(cat /proc/loadavg 2>/dev/null || echo unavailable)"
            for file in /sys/fs/cgroup/cpuset.cpus.effective /sys/fs/cgroup/cpu.stat /proc/pressure/cpu; do
              echo "[$file]"
              cat "$file" 2>/dev/null || echo unavailable
            done
            if [ -r /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]; then
              echo "governor=$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)"
            else
              echo 'governor=unavailable'
            fi
            for name in scaling_cur_freq scaling_min_freq scaling_max_freq cpuinfo_cur_freq; do
              file="/sys/devices/system/cpu/cpu0/cpufreq/$name"
              if [ -r "$file" ]; then
                echo "$name=$(cat "$file")"
              else
                echo "$name=unavailable"
              fi
            done
          } > perf-artifacts/linux-suite/host.txt
          {
            for file in \
              build-perf-nightly/tests/test_crdt_perf_gate \
              build-perf-nightly/tests/test_cspa_perf_gate \
              build-perf-nightly/meson-info/intro-buildoptions.json \
              bench/data/crdt/Insert_input.csv \
              bench/data/crdt/Remove_input.csv \
              bench/data/cspa/assign.csv \
              bench/data/cspa/dereference.csv; do
              if [ -f "$file" ]; then
                sha256sum "$file"
              else
                echo "missing $file"
              fi
            done
          } > perf-artifacts/linux-suite/sha256.txt
          if [ -f build-perf-nightly/meson-logs/testlog.txt ]; then
            cp build-perf-nightly/meson-logs/testlog.txt perf-artifacts/linux-suite/testlog.txt
          fi

      - name: Upload Linux perf suite evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-suite-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-artifacts/linux-suite
          if-no-files-found: error
          retention-days: 35

      # Windows: bench_stability_prep() sets thread affinity and raises
      # priority class from inside the test process. No external wrapper
      # needed; meson test invokes the binary directly.
      - name: Run perf suite (Windows)
        if: runner.os == 'Windows' && !inputs.strict_smoke
        shell: cmd
        env:
          WIRELOG_PERF_GATE: '1'
        run: |
          meson test -C build-perf --suite perf --print-errorlogs --num-processes 1

      - name: Collect flowlog portfolio (Linux)
        if: ${{ always() && runner.os == 'Linux' && !inputs.strict_smoke }}
        shell: bash
        run: |
          rc=$(awk -F= '$1 == "portfolio" { print $2 }' perf-artifacts/linux-suite/legacy-coverage-status.txt 2>/dev/null || echo 1)
          echo "portfolio_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "PORTFOLIO_EXIT=$rc" >> "$GITHUB_ENV"
          echo "portfolio_exit=$rc" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect flowlog portfolio (Windows)
        if: ${{ always() && runner.os == 'Windows' && !inputs.strict_smoke }}
        shell: bash
        env:
          PORTFOLIO_TIER: ${{ github.event.inputs.portfolio_tier || 'readme-full' }}
          PORTFOLIO_WORKERS: ${{ github.event.inputs.portfolio_workers || '1' }}
          PORTFOLIO_REPEAT: ${{ github.event.inputs.portfolio_repeat || '1' }}
        run: |
          set +e
          python scripts/perf/run-flowlog-portfolio.py \
            --bench build-perf/bench/bench_flowlog.exe \
            --tier "$PORTFOLIO_TIER" \
            --workers "$PORTFOLIO_WORKERS" \
            --repeat "$PORTFOLIO_REPEAT" \
            --out-dir perf-artifacts/portfolio
          rc=$?
          echo "portfolio_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "PORTFOLIO_EXIT=$rc" >> "$GITHUB_ENV"
          echo "portfolio_exit=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload flowlog portfolio artifacts
        if: ${{ always() && !inputs.strict_smoke }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-portfolio-${{ matrix.os }}-${{ matrix.compiler }}
          path: perf-artifacts/portfolio
          if-no-files-found: warn
          retention-days: 35

      - name: Summarize flowlog portfolio
        if: ${{ always() && !inputs.strict_smoke }}
        shell: bash
        run: |
          python scripts/perf/summarize-flowlog-portfolio.py \
            --artifact-dir perf-artifacts/portfolio \
            --artifact-name "perf-portfolio-${{ matrix.os }}-${{ matrix.compiler }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          echo "## Perf Nightly: ${{ matrix.os }} / ${{ matrix.compiler }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${STATUS}**" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNNER_OS" = Linux ]; then
            testlog=build-perf-nightly-trace/meson-logs/testlog.txt
            [ -f "$testlog" ] || testlog=build-perf-nightly/meson-logs/testlog.txt
            if [ -f perf-artifacts/linux-suite/campaign-status.txt ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat perf-artifacts/linux-suite/campaign-status.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            testlog=build-perf/meson-logs/testlog.txt
          fi
          if [ -f "$testlog" ]; then
            echo '<details><summary>Perf suite testlog</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -A 30 'test_log_perf_gate' "$testlog" 2>/dev/null \
              | head -200 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          fi

  portfolio-skip-rate:
    name: Perf portfolio SKIP-rate history
    needs: perf
    if: ${{ always() && !inputs.strict_smoke }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Download recent portfolio artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p perf-artifacts/history perf-artifacts/skip-rate
          warnings=perf-artifacts/skip-rate/warnings.log
          : > "$warnings"
          cutoff="$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          if ! gh run list \
              --workflow perf-nightly.yml \
              --created ">=$cutoff" \
              --limit 100 \
              --json databaseId \
              --jq '.[].databaseId' > perf-artifacts/skip-rate/runs.txt; then
            echo "gh run list failed; no history downloaded" >> "$warnings"
          fi
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            dest="perf-artifacts/history/run-$run_id"
            mkdir -p "$dest"
            if ! gh run download "$run_id" \
                --pattern 'perf-portfolio-*' \
                --dir "$dest"; then
              echo "failed to download perf portfolio artifacts for run $run_id" >> "$warnings"
            fi
          done < perf-artifacts/skip-rate/runs.txt

      - name: Summarize portfolio SKIP-rate history
        if: always()
        shell: bash
        run: |
          mkdir -p perf-artifacts/skip-rate
          python scripts/perf/summarize-flowlog-portfolio-history.py \
            --root perf-artifacts/history \
            --window-days 30 \
            --json-out perf-artifacts/skip-rate/skip-rate.json \
            > perf-artifacts/skip-rate/skip-rate.md
          if [ -s perf-artifacts/skip-rate/warnings.log ]; then
            {
              echo ''
              echo '<details><summary>Artifact download warnings</summary>'
              echo ''
              sed 's/^/- /' perf-artifacts/skip-rate/warnings.log
              echo ''
              echo '</details>'
            } >> perf-artifacts/skip-rate/skip-rate.md
          fi
          cat perf-artifacts/skip-rate/skip-rate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload portfolio SKIP-rate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-portfolio-skip-rate
          path: perf-artifacts/skip-rate
          if-no-files-found: warn
          retention-days: 35

  # Authoritative DOOP execution for issue #1351. Correctness gates and DOOP
  # timing run on the tagged perf runner. The calibrated
  # threshold is enforced; the governor is captured as provenance only.
  perf-stable:
    name: Perf wirelog-perf / correctness + DOOP
    if: github.repository == 'semantic-reasoning/wirelog' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.strict_smoke)
    runs-on: [self-hosted, Linux, X64, perf]
    concurrency:
      group: wirelog-perf-linux
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Verify perf runner capacity
        shell: bash
        run: |
          set -euo pipefail
          taskset -pc $$
          nproc --all
          taskset -pc $$ | grep -Eq ':[[:space:]]*[0-9]'

      - name: Run correctness and DOOP gates in the local perf image
        env:
          WL_DOOP_PERF_GATE_TARGET_MS: ${{ vars.WL_DOOP_PERF_GATE_TARGET_MS }}
        run: scripts/ci/run-perf-stable-linux.sh

      - name: Upload authoritative perf logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-stable-test-logs
          path: |
            build-perf-error/meson-logs/testlog.txt
            build-perf-error/meson-logs/doop-testlog.txt
          if-no-files-found: error
          retention-days: 35

      - name: Capture DOOP execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-artifacts/doop
          if [[ -f build-perf-error/meson-logs/doop-testlog.txt ]]; then
            cp build-perf-error/meson-logs/doop-testlog.txt perf-artifacts/doop/
          else
            echo 'MISSING: build-perf-error/meson-logs/doop-testlog.txt' \
              > perf-artifacts/doop/doop-testlog.txt
          fi
          if [[ -f scripts/release/downstream-matrix-oracles.tsv ]]; then
            cp scripts/release/downstream-matrix-oracles.tsv perf-artifacts/doop/
          else
            echo 'MISSING: downstream-matrix-oracles.tsv' \
              > perf-artifacts/doop/downstream-matrix-oracles.tsv
          fi
          if compgen -G 'bench/data/doop/*.facts' > /dev/null; then
            ( cd bench/data/doop && sha256sum -- *.facts | LC_ALL=C sort -k2 \
                | sha256sum | awk '{print $1}' ) > perf-artifacts/doop/facts-manifest.sha256
          else
            echo 'MISSING: bench/data/doop/*.facts' \
              > perf-artifacts/doop/facts-manifest.sha256
          fi
          commit=$(git rev-parse HEAD)
          affinity=$(taskset -pc $$ | sed 's/.*: //')
          governor=$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor \
            2>/dev/null || echo unavailable)
          printf '{\n  "commit": "%s",\n  "workflow": "%s",\n  "run_id": "%s",\n  "runner_os": "%s",\n  "runner_arch": "%s",\n  "runner_image": "%s",\n  "cpu_count": %s,\n  "affinity": "%s",\n  "governor": "%s",\n  "workers": 8,\n  "repeat": 5,\n  "mode": "strict-tagged",\n  "timing": "enforced"\n}\n' \
            "$commit" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "$RUNNER_OS" \
            "$RUNNER_ARCH" "${ImageOS:-unknown}" "$(nproc --all)" \
            "$affinity" "$governor" > perf-artifacts/doop/host.json
          printf 'capture_completed=true\n' > perf-artifacts/doop/evidence-status.txt

      - name: Upload DOOP execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-doop-evidence
          path: perf-artifacts/doop
          if-no-files-found: error
          retention-days: 35

  # ==========================================================================
  # Stress nightly (Issue #594): runs the W=4 / R=500 freeze-cycle and
  # W=4 / R=5000 apply-roundtrip workloads under TSan instrumentation on
  # Linux GCC.  Independent of the perf gate above (different build flags
  # and different test suite) so a stress regression doesn't mask a perf
  # regression and vice-versa.  See docs/STRESS_BASELINE.md for the
  # release-tier (W=8) invocation and the flake-baseline protocol.
  # ==========================================================================
  stress:
    name: Stress / ubuntu-latest / gcc / TSan
    if: ${{ !inputs.strict_smoke }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Meson 1.12.0
        uses: ./.github/actions/setup-meson

      - name: Configure debug + TSan
        run: >
          meson setup build-stress-tsan
          -Db_sanitize=thread
          -Db_lundef=false
          -Dthreads=posix
          -Dtests=true
          --buildtype=debug
        env:
          CC: gcc

      - name: Build
        run: meson compile -C build-stress-tsan

      - name: Run stress-nightly suite under TSan
        env:
          TSAN_OPTIONS: 'halt_on_error=1:second_deadlock_stack=1'
        run: |
          meson test -C build-stress-tsan --suite stress-nightly \
            --print-errorlogs --num-processes 1

      - name: Publish results
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          echo "## Stress Nightly: ubuntu-latest / gcc / TSan" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${STATUS}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build-stress-tsan/meson-logs/testlog.txt ]; then
            echo '<details><summary>Stress-nightly testlog</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -A 30 'stress_harness' build-stress-tsan/meson-logs/testlog.txt 2>/dev/null \
              | head -200 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          fi
