name: Issue 1913 paired performance diagnosis (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-perf:
    name: Paired gates / Ubuntu 24.04 / GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify diagnostic ref
        env:
          EXPECTED_BASE_SHA: 8d91c2da2b188b94af5b9f1da21c569d80ccb387
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/diagnostic/issue-1913-ab
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          test "$(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort | tr '\n' ' ')" \
            = ".github/workflows/perf-nightly.yml scripts/ci/run-issue-1913-paired-perf.sh "

      - name: Install Linux build and affinity tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build linux-tools-common linux-tools-generic

      - name: Set up Meson 1.12.0
        uses: ./.github/actions/setup-meson

      - name: Fetch and verify measured source trees
        env:
          BASE_SHA: 8d91c2da2b188b94af5b9f1da21c569d80ccb387
          CANDIDATE_SHA: b712e443457bca0a9d573b29af5885453728f504
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/feat/issue-1369-memory-admission:refs/remotes/origin/feat/issue-1369-memory-admission
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/feat/issue-1369-memory-admission)" = "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/wirelog-base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/wirelog-candidate" "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/issue-1913-artifacts"
          gcc_version=$(gcc -dumpfullversion)
          meson_version=$(meson --version)
          case "$gcc_version" in
            13.3.*) ;;
            *) echo "expected CI GCC 13.3.x, found $gcc_version" >&2; exit 1 ;;
          esac
          test "$meson_version" = 1.12.0
          {
            printf 'diagnostic_workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'base_tree_sha=%s\n' "$BASE_SHA"
            printf 'candidate_tree_sha=%s\n' "$CANDIDATE_SHA"
            printf 'gcc_version=%s\n' "$gcc_version"
            printf 'meson_version=%s\n' "$meson_version"
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            uname -a
            lscpu
            gcc --version
            meson --version
            git -C "$RUNNER_TEMP/wirelog-base" status --porcelain
            git -C "$RUNNER_TEMP/wirelog-candidate" status --porcelain
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor || true
          } > "$RUNNER_TEMP/issue-1913-artifacts/runner.txt"

      - name: Require stable measurement host
        run: |
          set -euo pipefail
          sudo cpupower frequency-set -g performance || true
          governor=$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)
          echo "cpu0 governor=$governor"
          test "$governor" = performance
          taskset -c 0 true
          printf 'cpu0 governor=%s\n' "$governor" \
            >> "$RUNNER_TEMP/issue-1913-artifacts/runner.txt"

      - name: Configure and build both gate binaries
        run: |
          set -euo pipefail
          for variant in base candidate; do
            if [ "$variant" = base ]; then
              source_tree="$RUNNER_TEMP/wirelog-base"
            else
              source_tree="$RUNNER_TEMP/wirelog-candidate"
            fi
            (
              cd "$source_tree"
              CC=gcc meson setup build-perf \
                --buildtype=release \
                -Doptimization=s \
                -Db_lto=true \
                -Dwirelog_log_max_level=trace \
                -Dtests=true \
                -DmbedTLS=disabled
              meson introspect build-perf --buildoptions \
                > "$RUNNER_TEMP/issue-1913-artifacts/$variant-meson-options.json"
              meson compile -C build-perf \
                tests/test_crdt_perf_gate tests/test_cspa_perf_gate
            )
          done

      - name: Run paired CRDT and CSPA gates
        shell: bash
        run: |
          bash scripts/ci/run-issue-1913-paired-perf.sh \
            "$RUNNER_TEMP/wirelog-base" \
            "$RUNNER_TEMP/wirelog-candidate" \
            "$RUNNER_TEMP/issue-1913-artifacts"

      - name: Upload paired measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-1913-paired-perf-ubuntu-24.04
          path: ${{ runner.temp }}/issue-1913-artifacts
          if-no-files-found: error
          retention-days: 30
