name: Issue 1369 size attribution (temporary)

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact main commit used by PR #1903
        required: true
        type: string
        default: 8d91c2da2b188b94af5b9f1da21c569d80ccb387
      candidate_sha:
        description: Exact PR #1903 head to compare
        required: true
        type: string
        default: 3f9e94c6c16c3d69434308bf13d7fc7f4ae62959

permissions:
  contents: read

jobs:
  attribute-size:
    if: github.ref == 'refs/heads/diagnostic/issue-1369-size'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify dispatch ref and immutable inputs
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/diagnostic/issue-1369-size
          test "$BASE_SHA" = 8d91c2da2b188b94af5b9f1da21c569d80ccb387
          test "$CANDIDATE_SHA" = 3f9e94c6c16c3d69434308bf13d7fc7f4ae62959
          git fetch origin main feat/issue-1369-memory-admission
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/feat/issue-1369-memory-admission)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git status --short --branch

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build binutils

      - name: Set up Meson 1.12.0
        uses: ./.github/actions/setup-meson

      - name: Verify exact toolchain
        run: |
          set -euo pipefail
          gcc --version | tee gcc-version.txt
          gcc -dumpfullversion -dumpversion | grep -Eq '^13\.3(\.|$)'
          test "$(meson --version)" = 1.12.0
          ninja --version | tee ninja-version.txt
          ldd --version | head -1 | tee libc-version.txt
          uname -a | tee runner.txt

      - name: Build base and candidate, capture symbols and linker maps
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/issue-1369-size-evidence
        run: scripts/ci/run-issue-1369-size-attribution.sh "$BASE_SHA" "$CANDIDATE_SHA" "$EVIDENCE_DIR"

      - name: Upload size attribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-1369-size-attribution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/issue-1369-size-evidence
            gcc-version.txt
            ninja-version.txt
            libc-version.txt
            runner.txt
          if-no-files-found: warn
          retention-days: 14
