name: Paired Campaign V1 Shadow

on:
  workflow_dispatch:
    inputs:
      campaign_mode:
        description: 'Descriptive comparison, A/A control, or pinned #1913 diagnosis'
        required: true
        type: choice
        options:
          - comparison
          - aa_control
          - issue_1913
        default: aa_control
      base_sha:
        description: 'Full trusted main ancestor SHA (comparison only)'
        required: false
        type: string
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: wirelog-paired-perf-diagnostic
  cancel-in-progress: false

jobs:
  paired:
    name: Campaign v1 shadow evidence
    if: github.ref == 'refs/heads/main' && github.repository == 'semantic-reasoning/wirelog'
    runs-on: [self-hosted, Linux, X64, wirelog-perf]
    timeout-minutes: 360
    env:
      REQUESTED_MODE: ${{ inputs.campaign_mode }}
      REQUESTED_BASE: ${{ inputs.base_sha }}
      DISPATCH_SHA: ${{ github.sha }}
      # #2029 minimum measured revision; distinct from the collector implementation base.
      MINIMUM_SHA: c6e263d492828d1208fa11005c18d19b05342233
      ISSUE1913_BASE_SHA: 8d91c2da2b188b94af5b9f1da21c569d80ccb387
      ISSUE1913_CANDIDATE_SHA: 10d5ba8d9daba473476fa7a2aa75072da42cef39
      ISSUE1913_PROBE_SOURCE_SHA: 5f9d6c51df10766b4c099af9ebf9bcb362f9778a
      ISSUE1913_PROBE_BLOB: 06aa75dd22cae319a0ca17acfdfc63f6501abd95
      CANONICAL_REPOSITORY: https://github.com/semantic-reasoning/wirelog.git
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize durable evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-artifacts/paired
          printf 'event=%s requested_mode=%s requested_base=%s dispatch_sha=%s minimum_sha=%s\n' \
            "$GITHUB_EVENT_NAME" "$REQUESTED_MODE" "$REQUESTED_BASE" \
            "$DISPATCH_SHA" "$MINIMUM_SHA" > perf-artifacts/paired/dispatch.txt

      - name: Validate trusted revisions and resolve mode
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main^{commit})"
          test "$(git rev-parse HEAD)" = "$main_sha"
          test "$DISPATCH_SHA" = "$main_sha"
          git merge-base --is-ancestor "$MINIMUM_SHA" "$main_sha"
          candidate_sha="$main_sha"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            mode=aa_control
            base_sha="$main_sha"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            mode="$REQUESTED_MODE"
            case "$mode" in
              comparison)
                base_sha="$REQUESTED_BASE"
                test -n "$base_sha"
                test "$base_sha" != "$candidate_sha"
                ;;
              aa_control)
                test -z "$REQUESTED_BASE"
                base_sha="$main_sha"
                ;;
              issue_1913)
                test -z "$REQUESTED_BASE"
                base_sha="$ISSUE1913_BASE_SHA"
                candidate_sha="$ISSUE1913_CANDIDATE_SHA"
                ;;
              *) exit 1 ;;
            esac
          else
            exit 1
          fi
          for revision in "$base_sha" "$candidate_sha"; do
            test "${#revision}" -eq 40
            case "$revision" in
              *[!0123456789abcdef]*) exit 1 ;;
            esac
            if [[ "$mode" != issue_1913 ]]; then
              git cat-file -e "$revision^{commit}"
              git merge-base --is-ancestor "$MINIMUM_SHA" "$revision"
              git merge-base --is-ancestor "$revision" "$main_sha"
              git show "$revision:tests/test_crdt_perf_gate.c" | grep -F 'WIRELOG_CRDT_PROBE' >/dev/null
            fi
          done
          printf 'mode=%s base=%s candidate=%s fetched_main=%s\n' \
            "$mode" "$base_sha" "$candidate_sha" "$main_sha" > perf-artifacts/paired/trusted-revisions.txt
          printf 'CAMPAIGN_MODE=%s\nBASE_SHA=%s\nCANDIDATE_SHA=%s\n' \
            "$mode" "$base_sha" "$candidate_sha" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Meson 1.12.0
        uses: ./.github/actions/setup-meson

      - name: Create HOME-contained Python environment
        shell: bash
        run: |
          set -euo pipefail
          home_real="$(realpath -e "$HOME")"
          cache_root="$home_real/.cache"
          mkdir -p "$cache_root"
          test "$(realpath -e "$cache_root")" = "$cache_root"
          python_venv="$cache_root/wirelog-perf-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(realpath -m "$python_venv")" = "$python_venv"
          test ! -e "$python_venv"
          printf 'PERF_VENV=%s\n' "$python_venv" >> "$GITHUB_ENV"
          uv venv --system-site-packages "$python_venv"
          printf '%s/bin\n' "$python_venv" >> "$GITHUB_PATH"
          test "$("$python_venv/bin/python" -c 'import sys; print(sys.prefix)')" = "$python_venv"

      - name: Fetch and materialize pinned #1913 sources
        if: env.CAMPAIGN_MODE == 'issue_1913'
        shell: bash
        run: |
          set -euo pipefail
          home_real="$(realpath -e "$HOME")"
          cache_root="$home_real/.cache"
          mkdir -p "$cache_root"
          test "$(realpath -e "$cache_root")" = "$cache_root"
          pair_root="$cache_root/wirelog-1913-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(realpath -m "$pair_root")" = "$pair_root"
          test ! -e "$pair_root"
          mkdir "$pair_root"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            > "$pair_root/.wirelog-perf-owned"
          repo="$pair_root/repository"
          printf 'PAIR_ROOT=%s\nSOURCE_REPO=%s\n' "$pair_root" "$repo" >> "$GITHUB_ENV"
          mkdir "$repo"
          test "$(python -c 'import sys; print(sys.prefix)')" = "$PERF_VENV"
          git -C "$repo" init --quiet
          git -C "$repo" remote add canonical "$CANONICAL_REPOSITORY"
          git -C "$repo" fetch --no-tags canonical \
            "$ISSUE1913_BASE_SHA" "$ISSUE1913_CANDIDATE_SHA" \
            "$ISSUE1913_PROBE_SOURCE_SHA"
          for revision in "$ISSUE1913_BASE_SHA" "$ISSUE1913_CANDIDATE_SHA" \
                          "$ISSUE1913_PROBE_SOURCE_SHA"; do
            test "$(git -C "$repo" cat-file -t "$revision")" = commit
          done
          test "$(git -C "$repo" rev-parse \
            "$ISSUE1913_PROBE_SOURCE_SHA:tests/test_crdt_perf_gate.c")" = \
            "$ISSUE1913_PROBE_BLOB"
          test "$(git -C "$repo" cat-file -t "$ISSUE1913_PROBE_BLOB")" = blob
          materialization_dir="$GITHUB_WORKSPACE/perf-artifacts/paired/materialization"
          mkdir -p "$materialization_dir"
          (cd "$repo" && python \
            "$GITHUB_WORKSPACE/scripts/perf/materialize-1913-diagnostic.py" \
            --side base) | tee "$materialization_dir/base.json"
          (cd "$repo" && python \
            "$GITHUB_WORKSPACE/scripts/perf/materialize-1913-diagnostic.py" \
            --side candidate) | tee "$materialization_dir/candidate.json"
          base_wrapper="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["wrapper_sha"])' \
            "$materialization_dir/base.json")"
          candidate_wrapper="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["wrapper_sha"])' \
            "$materialization_dir/candidate.json")"
          test "$base_wrapper" != "$candidate_wrapper"
          printf 'ORIGINAL_BASE_SHA=%s\nORIGINAL_CANDIDATE_SHA=%s\n' \
            "$ISSUE1913_BASE_SHA" "$ISSUE1913_CANDIDATE_SHA" >> "$GITHUB_ENV"
          printf 'BASE_SHA=%s\nCANDIDATE_SHA=%s\nSOURCE_REPO=%s\nPAIR_ROOT=%s\n' \
            "$base_wrapper" "$candidate_wrapper" "$repo" "$pair_root" >> "$GITHUB_ENV"

      - name: Create independent worktrees
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CAMPAIGN_MODE" == issue_1913 ]]; then
            pair_root="$PAIR_ROOT"
            source_repo="$SOURCE_REPO"
            base_revision="$BASE_SHA"
          else
            pair_root="$RUNNER_TEMP/wirelog-paired-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            test ! -e "$pair_root"
            mkdir "$pair_root"
            printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
              > "$pair_root/.wirelog-perf-owned"
            source_repo="$GITHUB_WORKSPACE"
            base_revision="$BASE_SHA"
          fi
          git -C "$source_repo" worktree add --detach "$pair_root/base" "$base_revision"
          if [[ "$CAMPAIGN_MODE" == aa_control ]]; then
            printf 'BASE_SRC=%s/base\nCANDIDATE_SRC=%s/base\nBASE_BUILD=%s/base-build\nCANDIDATE_BUILD=%s/base-build\n' \
              "$pair_root" "$pair_root" "$pair_root" "$pair_root" >> "$GITHUB_ENV"
          else
            git -C "$source_repo" worktree add --detach "$pair_root/candidate" "$CANDIDATE_SHA"
            printf 'BASE_SRC=%s/base\nCANDIDATE_SRC=%s/candidate\nBASE_BUILD=%s/base-build\nCANDIDATE_BUILD=%s/candidate-build\n' \
              "$pair_root" "$pair_root" "$pair_root" "$pair_root" >> "$GITHUB_ENV"
          fi
          printf 'SOURCE_REPO=%s\nPAIR_ROOT=%s\n' "$source_repo" "$pair_root" >> "$GITHUB_ENV"
          printf 'BASE_BUILD_LOG=%s/base-complete-build.log\nCANDIDATE_BUILD_LOG=%s/base-complete-build.log\n' \
            "$GITHUB_WORKSPACE/perf-artifacts/paired" "$GITHUB_WORKSPACE/perf-artifacts/paired" >> "$GITHUB_ENV"

      - name: Select available CPU
        shell: bash
        run: |
          set -euo pipefail
          cpu="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          printf 'CAMPAIGN_CPU=%s\n' "$cpu" >> "$GITHUB_ENV"
          printf 'cpu=%s\n' "$cpu" > perf-artifacts/paired/affinity.txt
          taskset -pc $$ >> perf-artifacts/paired/affinity.txt

      - name: Build both production profiles
        shell: bash
        env:
          CC: gcc
        run: |
          set -euo pipefail
          if [[ "$CAMPAIGN_MODE" == aa_control ]]; then
            source="$BASE_SRC"
            build="$BASE_BUILD"
            {
              printf 'side=shared-aa source=%s build=%s phase=configure\n' "$source" "$build"
              meson setup "$build" "$source" --buildtype=release \
                -Dwirelog_log_max_level=trace -Dtests=true -DmbedTLS=disabled
            } 2>&1 | tee "perf-artifacts/paired/base-configure.log"
            {
              printf 'side=shared-aa source=%s build=%s phase=compile\n' "$source" "$build"
              meson compile -C "$build" bench_flowlog test_crdt_perf_gate test_cspa_perf_gate
            } 2>&1 | tee "perf-artifacts/paired/base-build.log"
            cat "perf-artifacts/paired/base-configure.log" "perf-artifacts/paired/base-build.log" \
              > "$BASE_BUILD_LOG"
          else
          for side in base candidate; do
            if [[ "$side" == base ]]; then
              source="$BASE_SRC"
              build="$BASE_BUILD"
            else
              source="$CANDIDATE_SRC"
              build="$CANDIDATE_BUILD"
            fi
            {
              printf 'side=%s source=%s build=%s phase=configure\n' "$side" "$source" "$build"
              meson setup "$build" "$source" --buildtype=release \
                -Dwirelog_log_max_level=trace -Dtests=true -DmbedTLS=disabled
            } 2>&1 | tee "perf-artifacts/paired/$side-configure.log"
            {
              printf 'side=%s source=%s build=%s phase=compile\n' "$side" "$source" "$build"
              meson compile -C "$build" bench_flowlog test_crdt_perf_gate test_cspa_perf_gate
            } 2>&1 | tee "perf-artifacts/paired/$side-build.log"
            cat "perf-artifacts/paired/$side-configure.log" "perf-artifacts/paired/$side-build.log" \
              > "perf-artifacts/paired/$side-complete-build.log"
          done
            printf 'BASE_BUILD_LOG=%s/base-complete-build.log\nCANDIDATE_BUILD_LOG=%s/candidate-complete-build.log\n' \
              "$GITHUB_WORKSPACE/perf-artifacts/paired" "$GITHUB_WORKSPACE/perf-artifacts/paired" >> "$GITHUB_ENV"
          fi

      - name: Collect campaign v1
        shell: bash
        run: |
          set -euo pipefail
          collector_mode="$CAMPAIGN_MODE"
          if [[ "$collector_mode" == issue_1913 ]]; then
            collector_mode=comparison
          fi
          aa_option=()
          if [[ "$collector_mode" == aa_control ]]; then
            aa_option+=(--qualify-aa)
          fi
          python scripts/perf/paired-benchmark.py v1 \
            --mode "$collector_mode" --base-sha "$BASE_SHA" --candidate-sha "$CANDIDATE_SHA" \
            --base-source "$BASE_SRC" --candidate-source "$CANDIDATE_SRC" \
            --base-build "$BASE_BUILD" --candidate-build "$CANDIDATE_BUILD" \
            --base-build-log "$BASE_BUILD_LOG" \
            --candidate-build-log "$CANDIDATE_BUILD_LOG" \
            --cpu "$CAMPAIGN_CPU" --timeout 180 --out-dir perf-artifacts/paired/campaign \
            "${aa_option[@]}"

      - name: Qualify A/A noise and host control
        if: always() && env.CAMPAIGN_MODE == 'aa_control'
        continue-on-error: true
        shell: bash
        run: |
          python scripts/perf/qualify-paired-aa.py \
            --evidence-dir perf-artifacts/paired/campaign \
            --preflight perf-artifacts/paired/campaign/preflight.json \
            --output perf-artifacts/paired/campaign/aa-qualification-v1.json

      - name: Validate complete #1913 source and campaign provenance
        if: always() && env.CAMPAIGN_MODE == 'issue_1913'
        shell: bash
        run: |
          set -euo pipefail
          home_real="$(realpath -e "$HOME")"
          repository="${SOURCE_REPO:-$home_real/.cache/wirelog-1913-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/repository}"
          python scripts/perf/validate-1913-diagnostic.py \
            --repository "$repository" \
            --materialization-dir perf-artifacts/paired/materialization \
            --evidence-dir perf-artifacts/paired/campaign \
            --output perf-artifacts/paired/issue-1913-validation.json

      - name: Upload all paired diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-paired-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf-artifacts/paired
          if-no-files-found: error
          retention-days: 35

      - name: Summarize diagnostic status
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lines = ["## Campaign v1 shadow diagnostic",
                   "All timing statistics are descriptive. This workflow does not change or replace a required perf gate.",
                   f"Mode: {os.environ.get('CAMPAIGN_MODE', 'unresolved')}",
                   f"Trusted base: {os.environ.get('BASE_SHA', 'unresolved')}",
                   f"Trusted candidate: {os.environ.get('CANDIDATE_SHA', 'unresolved')}",
                   f"Artifact: perf-paired-v1-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"]
          if os.environ.get('CAMPAIGN_MODE') == 'issue_1913':
              lines.extend([
                  f"Original #1913 baseline: {os.environ.get('ORIGINAL_BASE_SHA', 'unresolved')}",
                  f"Original #1913 candidate: {os.environ.get('ORIGINAL_CANDIDATE_SHA', 'unresolved')}",
                  "Synthetic source provenance: perf-artifacts/paired/materialization/*.json",
                  "Fail-closed source/campaign validation: perf-artifacts/paired/issue-1913-validation.json",
                  "Collector timing and source identity: perf-artifacts/paired/campaign/campaign-v1.json",
                  "CSPA bench_flowlog repeat=1 is descriptive and is not cspa_w1_gate or its 2050ms target.",
              ])
          status = Path('perf-artifacts/paired/campaign/collection-status.json')
          if status.exists():
              lines.append('Collector status/reason: ' + json.dumps(json.loads(status.read_text(encoding='utf-8')), sort_keys=True))
          else:
              lines.append('Collector status unavailable; inspect partial evidence.')
          qualification = Path('perf-artifacts/paired/campaign/aa-qualification-v1.json')
          if qualification.exists():
              result = json.loads(qualification.read_text(encoding='utf-8'))
              lines.append('A/A qualification (separate from descriptive v1 status): ' +
                           json.dumps({'status': result.get('status'), 'reason': result.get('reason')}, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n\n'.join(lines) + '\n')
          PY

      - name: Clean independent worktrees and builds
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          campaign_mode="${CAMPAIGN_MODE:-${REQUESTED_MODE:-unresolved}}"
          if [[ "$campaign_mode" == issue_1913 ]]; then
            home_real="$(realpath -e "$HOME")"
            pair_root="${PAIR_ROOT:-$home_real/.cache/wirelog-1913-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
            source_repo="${SOURCE_REPO:-$pair_root/repository}"
            test "$(realpath -m "$pair_root")" = \
              "$home_real/.cache/wirelog-1913-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if [[ ! -f "$pair_root/.wirelog-perf-owned" ]] || \
               [[ "$(cat "$pair_root/.wirelog-perf-owned")" != "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ]]; then
              pair_root=''
              source_repo=''
            fi
          else
            test -n "$RUNNER_TEMP"
            test "$RUNNER_TEMP" != /
            pair_root="$RUNNER_TEMP/wirelog-paired-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            source_repo="$GITHUB_WORKSPACE"
            test "$(realpath -m "$pair_root")" = "$(realpath -m "$RUNNER_TEMP")/wirelog-paired-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if [[ ! -f "$pair_root/.wirelog-perf-owned" ]] || \
               [[ "$(cat "$pair_root/.wirelog-perf-owned")" != "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ]]; then
              pair_root=''
            fi
          fi
          cleanup_status=0
          for side in base candidate; do
            if [[ -n "$pair_root" && -d "$pair_root/$side" && -e "$source_repo/.git" ]]; then
              git -C "$source_repo" worktree remove --force "$pair_root/$side" || cleanup_status=1
            fi
          done
          if [[ -n "$pair_root" ]]; then
            rm -rf -- "$pair_root" || cleanup_status=1
          fi
          if [[ -n "$source_repo" && -e "$source_repo/.git" ]]; then
            git -C "$source_repo" worktree prune || cleanup_status=1
          fi
          if [[ -n "${PERF_VENV:-}" ]]; then
            home_real="$(realpath -e "$HOME")"
            test "$(realpath -m "$PERF_VENV")" = \
              "$home_real/.cache/wirelog-perf-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            rm -rf -- "$PERF_VENV" || cleanup_status=1
          fi
          exit "$cleanup_status"
