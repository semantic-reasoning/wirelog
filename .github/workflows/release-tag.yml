name: Release tag verification

on:
  push:
    tags:
      - 'v0.*'
      - 'v1.*'
  workflow_dispatch:
    inputs:
      tag_ref:
        description: 'Existing immutable release tag to verify'
        required: true
        type: string
      expected_sha:
        description: 'Commit SHA expected at tag_ref'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
  TAG_REF: ${{ inputs.tag_ref || github.ref_name }}

jobs:
  validate-input:
    name: Validate release tag and commit
    runs-on: ubuntu-latest
    steps:
      - name: Validate release input shape
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG_REF" =~ ^v(0|1)\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
      - name: Verify immutable release reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse "refs/tags/$TAG_REF^{}")" = "$EXPECTED_SHA"

  default:
    name: Tag / default
    needs: [validate-input]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
      - name: Verify tagged commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build b3sum
      - name: Build and test default suite
        run: |
          meson setup build-default -Dtests=true --buildtype=debug
          meson compile -C build-default
          meson test -C build-default --print-errorlogs

  abi:
    name: Tag / ABI
    needs: [validate-input]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
      - name: Verify tagged commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build abigail-tools b3sum
      # WIRELOG_ABI_REQUIRED=1: this is the GA ABI gate, and a gate that skips
      # asserts nothing. abigail-tools is installed above, so abidiff is present
      # here and a skip means something is wrong rather than unavailable.
      # Advisory (unset) everywhere else, where abidiff genuinely is absent.
      # scripts/ci/test-required-gates.sh asserts this line still exists (#1303).
      - name: Build and test ABI suite
        env:
          WIRELOG_ABI_REQUIRED: '1'
        run: |
          meson setup build-abi -Dtests=true --buildtype=debug
          meson compile -C build-abi
          meson test -C build-abi --suite abi --print-errorlogs

  perf:
    name: Tag / performance and RSS
    needs: [validate-input]
    runs-on: [self-hosted, linux, x64, wirelog-perf]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
      - name: Verify tagged commit and stable host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          governor=/sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
          test -r "$governor"
          test "$(cat "$governor")" = performance
      - name: Install dependencies
        run: |
          command -v meson
          command -v ninja
          command -v taskset
      - name: Build trace and stripped configurations
        env:
          CC: gcc
        run: |
          meson setup build-perf-trace --buildtype=release -Dwirelog_log_max_level=trace -Dtests=true -DmbedTLS=disabled
          meson setup build-perf-error --buildtype=release -Dwirelog_log_max_level=error -Dtests=true -DmbedTLS=disabled
          meson compile -C build-perf-trace
          meson compile -C build-perf-error
      - name: Run complete perf suite
        env:
          WIRELOG_PERF_GATE: '1'
        run: |
          # The complete suite includes both trace-only and stripped-build
          # sentinels. Strict execution is enforced below on the dedicated
          # release gates that support WIRELOG_PERF_REQUIRE=1.
          taskset -c 0 meson test -C build-perf-trace --suite perf --print-errorlogs --num-processes 1
      - name: Run required timing and RSS gates
        env:
          WIRELOG_PERF_GATE: '1'
          WIRELOG_PERF_REQUIRE: '1'
        run: |
          taskset -c 0 meson test -C build-perf-trace log_perf_gate --print-errorlogs --num-processes 1
          taskset -c 0 meson test -C build-perf-error crdt_perf_gate cspa_w1_gate sub_ms_graph_perf_gate rss_bounded_release --print-errorlogs --num-processes 1
          scripts/ci/check-perf-gate-execution.sh \
            build-perf-trace/meson-logs/testlog.txt \
            build-perf-error/meson-logs/testlog.txt
          awk -v wanted='test:         stress-release - wirelog:rss_bounded_release' '
            $0 == wanted { capture = 1; next }
            capture && /^===================================/ { exit }
            capture { print }
          ' build-perf-error/meson-logs/testlog.txt > rss-gate.log
          grep -Eq '^result:[[:space:]]+exit status 0$' rss-gate.log
          ! grep -Fq 'SKIP:' rss-gate.log

  fuzz:
    name: Tag / fuzz smoke
    needs: [validate-input]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
      - name: Verify tagged commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang meson ninja-build
      - name: Build fuzz targets
        run: |
          CC=clang meson setup build-fuzz -Denable_fuzz=true -Db_sanitize=address -Db_lundef=false -Dtests=true
          meson compile -C build-fuzz parser_fuzz csv_reader_fuzz intern_fuzz compound_arena_fuzz
      - name: Run 60-second seed campaign per target
        run: |
          scripts/fuzz/run-libfuzzer-soak.sh --build-dir build-fuzz --work-dir fuzz-evidence --duration 60s --all
          meson test -C build-fuzz --suite fuzz --print-errorlogs
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-tag-fuzz-${{ env.TAG_REF }}
          path: fuzz-evidence
          if-no-files-found: error
          retention-days: 35

  mbedtls:
    name: Tag / mbedTLS enabled
    needs: [validate-input]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
      - name: Verify tagged commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build libmbedtls-dev
      - name: Build and test enabled crypto validation
        run: |
          meson setup build-mbedtls -Dtests=true -DmbedTLS=enabled --buildtype=debug
          meson compile -C build-mbedtls
          meson test -C build-mbedtls cryptographic_hashes --print-errorlogs

  upgrade:
    name: Tag / 0.30.0 upgrade matrix
    needs: [validate-input]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
      - name: Verify tagged candidate and baseline tag
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse --verify 'v0.30.0^{commit}'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build
      - name: Run synthetic consumer upgrade matrix
        env:
          UPGRADE_MATRIX_LOG_DIR: upgrade-evidence
        run: scripts/upgrade/run-upgrade-matrix.sh --old-ref v0.30.0 --candidate-ref "$TAG_REF"
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-matrix-${{ env.TAG_REF }}
          path: upgrade-evidence/
          if-no-files-found: error
          retention-days: 35

  downstream:
    name: Tag / six-workload downstream matrix
    needs: [validate-input]
    runs-on: [self-hosted, linux, x64, wirelog-ga]
    concurrency: wirelog-ga-downstream
    timeout-minutes: 360
    env:
      WIRELOG_GA_ISOLATION_CONTROL: ${{ vars.WIRELOG_GA_ISOLATION_CONTROL }}
      WIRELOG_GA_ISOLATION_ASSERTION: ${{ vars.WIRELOG_GA_ISOLATION_ASSERTION }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
      - name: Verify tagged commit and isolated runner contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(getconf _NPROCESSORS_ONLN)" -ge 8
          test "$(awk '/^VERSION_ID=/ {gsub(/\"/, "", $2); print $2}' /etc/os-release)" = 24.04
          test "$(awk '/MemTotal:/ {print int($2 / 1024 / 1024)}' /proc/meminfo)" -ge 64
          test "$(df -Pk . | awk 'NR == 2 {print int($4 / 1024 / 1024)}')" -ge 250
          governor=/sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
          test -r "$governor"
          test "$(cat "$governor")" = performance
          test -n "$WIRELOG_GA_ISOLATION_CONTROL"
          test "$WIRELOG_GA_ISOLATION_CONTROL" != *$'\t'*
          test "$WIRELOG_GA_ISOLATION_CONTROL" != *$'\n'*
          test "$WIRELOG_GA_ISOLATION_ASSERTION" = dedicated-runner-group
          test "$RUNNER_GROUP" = wirelog-ga
          command -v meson
          command -v ninja
          command -v sha256sum
          command -v b3sum
          command -v timeout
          command -v gcc
          command -v curl
          command -v unzip
      - name: Build deterministic candidate archive
        run: |
          mkdir -p downstream-dist
          scripts/release/make-tarball.sh downstream-dist "$TAG_REF"
      - name: Execute pinned six-workload matrix
        run: |
          archive=$(find downstream-dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$archive"
          scripts/release/run-downstream-matrix.sh \
            --tarball "$archive" --candidate-sha "$EXPECTED_SHA" \
            --oracle-sha256 4029e35d72e91f83700592d6dddc4f528e5a4400fa9eb822723b3955146df62d \
            --output-dir downstream-evidence
      - name: Upload downstream evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downstream-matrix-${{ env.TAG_REF }}
          path: |
            downstream-dist/
            downstream-evidence/
            downstream-evidence/isolation-evidence.tsv
          if-no-files-found: error
          retention-days: 90
      - name: Clean dedicated runner workspace
        if: always()
        run: rm -rf downstream-dist downstream-evidence

  sanitizers:
    name: Tag / Tier-1 sanitizers
    needs: [validate-input]
    # Meson has no separate asan/tsan suite: the reusable workflow runs the
    # complete test graph in ASan/UBSan and TSan-configured build directories.
    # This is the repository's equivalent of the issue's --suite asan/tsan
    # requirement and keeps sanitizer coverage from silently narrowing.
    uses: ./.github/workflows/tier1-sanitizers.yml
    with:
      ref: ${{ inputs.tag_ref || github.ref_name }}
      expected_sha: ${{ inputs.expected_sha || github.sha }}

  release-verification:
    name: Tag / release verification gate
    if: ${{ always() }}
    needs: [default, abi, perf, fuzz, mbedtls, sanitizers, upgrade, downstream]
    runs-on: ubuntu-latest
    steps:
      - name: Require every tagged verification job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "verification results: $RESULTS"
          IFS=',' read -ra statuses <<< "$RESULTS"
          test "${#statuses[@]}" -eq 8
          for result in "${statuses[@]}"; do
            test "$result" = success
          done

  release-artifacts:
    name: Tag / source artifacts and provenance
    if: ${{ needs.release-verification.result == 'success' }}
    needs: [release-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A job-level permissions block REPLACES the workflow-level one rather than
    # merging with it, so every scope this job needs must be listed here or it
    # silently becomes `none`. `attestations: write` is load-bearing for the
    # attest and download steps below, and `id-token: write` for both the
    # attestation and cosign keyless signing.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG_REF }}
          fetch-depth: 0
      - name: Verify tagged commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install checksum tools
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum
      - name: Build deterministic source archive
        run: scripts/release/make-tarball.sh dist "$TAG_REF"
      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/wirelog-*.tar.gz
      - name: Download provenance attestation bundle
        # An authenticated API call: without a token `gh` has no hosts.yml on a
        # runner and refuses outright. Scoped to this step so the token is not
        # placed in the environment of the actions around it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && gh attestation download "wirelog-"*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --limit 1)
          attestation=$(find dist -maxdepth 1 -type f -name 'sha256*.jsonl' -print -quit)
          test -n "$attestation"
          mv "$attestation" "dist/wirelog-${TAG_REF#v}.intoto.jsonl"
      - name: Install cosign
        # Pinned to a commit rather than a floating major, deliberately against
        # the convention used elsewhere in this repository: this is the only job
        # holding both `id-token: write` and `contents: write`, and this action
        # places the binary that then signs with the repository's identity.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'
      - name: Sign the source archive
        run: |
          archive=$(find dist -maxdepth 1 -type f -name 'wirelog-*.tar.gz' -print -quit)
          test -n "$archive"
          scripts/release/sign-artifacts.sh "$archive"
      - name: Verify the signature with the published verifier
        # Round-trip through the same script downstream consumers are told to
        # use, so a divergence between signer and verifier fails here rather
        # than in someone else's pipeline. --tag is deliberately omitted: it
        # runs `git verify-tag`, which needs the GPG key #1154 has not
        # established yet.
        #
        # This is the detached path, which resolves the signature through
        # Rekor's search index -- eventually consistent behind entry inclusion.
        # Seconds after signing it can transiently fail. That is safe here:
        # publication is the next step, so a flake blocks rather than ships,
        # and a re-run is safe because published assets are never overwritten.
        run: |
          archive=$(find dist -maxdepth 1 -type f -name 'wirelog-*.tar.gz' -print -quit)
          test -n "$archive"
          scripts/release/verify-release.sh "$archive" \
            --signature "$archive.sig" --certificate "$archive.pem"
      - name: Publish artifacts to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Write the notes to a real file rather than a process substitution,
          # which would hide both a non-zero exit and the empty-output case:
          # extract-changelog-section.sh emits nothing and exits 0 when the
          # CHANGELOG heading lacks its ` - YYYY-MM-DD` suffix.
          notes=$(mktemp)
          scripts/release/extract-changelog-section.sh "${TAG_REF#v}" > "$notes"
          scripts/release/publish-release-assets.sh "$TAG_REF" dist "$notes"
      - name: Upload source archive, checksums, signatures, and attestation
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ env.TAG_REF }}
          path: dist/
          if-no-files-found: error
          retention-days: 35
      - name: Upload partial evidence from a failed or cancelled run
        # Distinct name so an incomplete set can never be mistaken for the
        # complete one. Cancellation is included because a timeout-minutes
        # expiry does not reliably satisfy failure().
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-partial-${{ env.TAG_REF }}
          path: dist/
          if-no-files-found: warn
          retention-days: 7
