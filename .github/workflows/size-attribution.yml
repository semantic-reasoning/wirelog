name: Admission PR exact-profile size attribution

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open admission pull request to inspect (only allowlisted PRs are accepted)
        required: true
        type: choice
        options:
          - "1903"
          - "1945"
        default: "1903"
      base_sha:
        description: Fresh origin/main SHA used as the pull request base
        required: true
        type: string
        default: "65cd273685086a4b7410976be159d44d1615c48e"
      candidate_sha:
        description: Full current PR head SHA from the selected pull request
        required: true
        type: string
        default: "a4c7c622daa3b7247378acf71a74b7f40f4ff556"
      reference_sha:
        description: Leave empty for the initial base/head report; for later reductions, use the initial candidate SHA and keep it fixed across runs and matched to each report
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    name: Exact-profile size attribution
    if: ${{ github.repository == 'semantic-reasoning/wirelog' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require default branch and record runner identity
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main"
          mkdir -p size-attribution
          cat /etc/os-release > size-attribution/os-release.txt
          printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unavailable}" "${ImageVersion:-unavailable}" \
            > size-attribution/runner-image.txt
          scripts/ci/require-ubuntu-2404.sh

      - name: Install CI build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential binutils ninja-build libmbedtls-dev

      - name: Set up Meson 1.12.0
        uses: ./.github/actions/setup-meson

      - name: Create diagnostic Python environment
        run: uv venv .venv-size-attribution

      - name: Record tool versions
        run: |
          set -euo pipefail
          mkdir -p size-attribution
          {
            gcc --version
            gcc -dumpfullversion -dumpversion
            ld --version
            readelf --version
            addr2line --version
            meson --version
            ninja --version
            python --version
            .venv-size-attribution/bin/python --version
          } > size-attribution/tool-versions.txt 2>&1

      - name: Run contract tests
        run: .venv-size-attribution/bin/python scripts/ci/test-size-attribution.py -v

      - name: Build and attribute allowlisted PR size
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_PR_NUMBER: ${{ inputs.pr_number }}
          GH_BASE_SHA: ${{ inputs.base_sha }}
          GH_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_REFERENCE_SHA: ${{ inputs.reference_sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv-size-attribution/bin:$PATH"
          args=(
            --repository "$GH_REPOSITORY"
            --pr-number "$GH_PR_NUMBER"
            --base-sha "$GH_BASE_SHA"
            --candidate-sha "$GH_CANDIDATE_SHA"
            --workflow-ref "$WORKFLOW_REF"
            --repository-root "$PWD"
            --output "$PWD/size-attribution"
          )
          if [ -n "$GH_REFERENCE_SHA" ]; then
            args+=(--reference-sha "$GH_REFERENCE_SHA")
          fi
          .venv-size-attribution/bin/python scripts/ci/collect-size-attribution.py "${args[@]}"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ inputs.pr_number }}-size-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: size-attribution/
          if-no-files-found: warn
          retention-days: 14
